---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # The end-to-end tests drive the real binary against temporary
      # repositories; without it they would silently skip. Pinned to the version
      # the add-on image ships, so CI does not drift with distro packaging.
      - name: Install restic
        env:
          RESTIC_VERSION: "0.19.1"
          RESTIC_SHA256: f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c
        run: |
          curl -fsSL -o restic.bz2 \
            "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          echo "${RESTIC_SHA256}  restic.bz2" | sha256sum -c -
          bunzip2 restic.bz2
          sudo install -m 0755 restic /usr/local/bin/restic
          rm -f restic
          restic version

      - name: Install the package
        run: pip install -e '.[dev]'

      - name: Ruff
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest -q

  addon:
    name: Add-on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the add-on manifest
        uses: frenck/action-addon-linter@v2
        with:
          path: ./restic_pruner

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: restic_pruner/Dockerfile

      - name: Check that requirements.txt matches pyproject.toml
        run: python3 scripts/check_requirements.py

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: [python, addon]
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, amd64]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build the add-on image
        uses: docker/build-push-action@v6
        with:
          context: ./restic_pruner
          push: false
          platforms: ${{ matrix.arch == 'aarch64' && 'linux/arm64' || 'linux/amd64' }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-python:3.13-alpine3.22
            BUILD_ARCH=${{ matrix.arch }}
