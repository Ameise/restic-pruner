---
name: Release

# Publishes multi-arch images to GHCR when a version tag is pushed.
#
# The add-on installs by building locally, so this is not required for anyone to
# use it. Switch config.yaml to prebuilt images by adding:
#     image: ghcr.io/ameise/restic-pruner-{arch}
# once the first tag has been published.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - name: Read the add-on version
        id: version
        run: |
          version=$(grep '^version:' restic_pruner/config.yaml | cut -d'"' -f2)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "refs/tags/v${version}" != "${GITHUB_REF}" ] \
             && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "::error::tag ${GITHUB_REF} does not match config.yaml version ${version}"
            exit 1
          fi

      # Container registries reject uppercase repository names, and GitHub
      # Actions expressions have no lowercase function.
      - name: Lowercase the owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./restic_pruner
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-python:3.13-alpine3.22
            BUILD_ARCH=${{ matrix.arch }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/restic-pruner-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.name }}/restic-pruner-${{ matrix.arch }}:latest
