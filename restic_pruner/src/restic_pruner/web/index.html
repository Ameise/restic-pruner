<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restic Pruner</title>
<!-- The version this page was built from. Compared at runtime against what the
     add-on reports, so a page served from a stale cache can notice and say so.
     Kept in step with the other version strings by scripts/check_versions.py. -->
<meta name="build-version" content="0.4.1">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --card: #ffffff;
    --border: #e2e5ea;
    --text: #1b1f24;
    --muted: #6b7280;
    --accent: #03a9f4;
    --ok: #2e7d32;
    --fail: #c62828;
    /* One colour per job, used by the history tags and the duration chart so a
       line and a row are recognisably the same thing. */
    --job-prune: #1e88e5;
    --job-check: #8e24aa;
    --job-repack: #ef6c00;
    /* One colour per repository in the size charts. --accent is the first, so a
       single-repository install looks exactly as it did. */
    --series-2: #00897b;
    --series-3: #d81b60;
    --series-4: #7cb342;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418;
      --card: #1b1f24;
      --border: #2c3138;
      --text: #e6e8eb;
      --muted: #9aa3ad;
      --ok: #66bb6a;
      --fail: #ef5350;
      --job-prune: #64b5f6;
      --job-check: #ce93d8;
      --job-repack: #ffb74d;
      --series-2: #4db6ac;
      --series-3: #f06292;
      --series-4: #aed581;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 13px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  h3 { font-size: 16px; margin: 0; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .card-head .spacer { flex: 1; }
  .target { font-family: var(--mono); font-size: 12px; color: var(--muted); word-break: break-all; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 14px; }
  .row > span:first-child { color: var(--muted); }
  .row > span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .stale {
    position: fixed; inset: 0 0 auto 0; z-index: 20;
    padding: 10px 16px; text-align: center; font-size: 13px;
    background: var(--fail); color: #fff;
  }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  .chart { position: relative; }
  .chart h4 { margin: 0 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  /* Height follows width: the drawing scales uniformly so the axis labels inside
     it keep their shape. */
  .chart svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
  .chart svg text.tick { font-size: 9.5px; fill: var(--muted); font-family: inherit; }
  .chart .tip {
    position: absolute; z-index: 5; pointer-events: none;
    transform: translateY(-100%);
    background: var(--card); border: 1px solid var(--border); border-radius: 7px;
    padding: 5px 8px; font-size: 11.5px; line-height: 1.35; white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,.16); font-variant-numeric: tabular-nums;
  }
  .chart .tip.below { transform: none; }
  .chart .tip strong { display: block; font-size: 13px; }
  .chart .tip .who { display: block; color: var(--muted); }
  .chart .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .chart .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: baseline; }
  .chart .span { font-size: 11px; color: var(--muted); }
  .split { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0 18px; }
  .split h4 { margin: 10px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  .pill {
    display: inline-flex; align-items: center;
    padding: 2px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em;
    border: 1px solid currentColor;
  }
  .tag {
    display: inline-flex; align-items: center;
    padding: 2px 8px; border-radius: 5px;
    font-size: 11px; font-weight: 600; letter-spacing: .03em;
    color: #fff;
  }
  .tag.prune { background: var(--job-prune); }
  .tag.check { background: var(--job-check); }
  .tag.repack { background: var(--job-repack); }
  .pill.success { color: var(--ok); }
  .pill.failed { color: var(--fail); }
  .pill.running { color: var(--accent); }
  .pill.skipped, .pill.never { color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  button {
    font: inherit; font-size: 14px;
    padding: 7px 13px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { color: #fff; filter: brightness(1.08); }
  button.danger:hover:not(:disabled) { border-color: var(--fail); color: var(--fail); }
  button.small { font-size: 13px; padding: 5px 10px; }
  pre.log {
    margin: 0; padding: 12px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.45;
    max-height: 340px; overflow: auto; white-space: pre-wrap; word-break: break-word;
  }
  /* Eight columns do not fit a phone. Scroll the table inside its card rather
     than letting the whole page scroll sideways. */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px;
       text-transform: uppercase; letter-spacing: .04em; padding-bottom: 8px; }
  td { padding: 7px 8px 7px 0; border-top: 1px solid var(--border); }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .full { grid-column: 1 / -1; }
  .muted { color: var(--muted); }
  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 16px; box-shadow: 0 6px 24px rgba(0,0,0,.18);
    opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--fail); color: var(--fail); }
</style>
</head>
<body>
<header>
  <h1>Restic Pruner</h1>
  <span id="global-status" class="pill never">loading</span>
  <span class="spacer" style="flex:1"></span>
  <span class="target" id="version"></span>
  <span class="target" id="timezone"></span>
</header>

<div class="grid">
  <section class="card full" id="card-schedule">
    <h2>Schedule</h2>
    <div class="split">
      <div>
        <div class="row"><span>Prune</span><span id="prune-schedule" class="target"></span></div>
        <div class="row"><span>Next prune</span><span id="prune-next">–</span></div>
      </div>
      <div>
        <div class="row"><span>Check</span><span id="check-schedule" class="target"></span></div>
        <div class="row"><span>Next check</span><span id="check-next">–</span></div>
      </div>
      <div>
        <div class="row"><span>Repack</span><span id="repack-schedule" class="target"></span></div>
        <div class="row"><span>Next repack</span><span id="repack-next">–</span></div>
      </div>
    </div>
    <div class="actions">
      <button class="primary" data-run="prune">Prune all now</button>
      <button data-run="prune" data-dry="1">Prune (dry run)</button>
      <button data-run="check">Check all now</button>
      <button data-run="repack">Repack all now</button>
      <button data-run="repack" data-dry="1">Repack (dry run)</button>
    </div>
  </section>

  <div class="full grid" id="repositories"></div>

  <section class="card full" id="card-trends">
    <h2>Trends</h2>
    <div class="charts" id="charts">
      <p class="muted">Not enough finished runs yet.</p>
    </div>
  </section>

  <section class="card full" id="card-log">
    <h2><span id="log-title">Log</span></h2>
    <pre class="log" id="log">No run selected.</pre>
  </section>

  <section class="card full">
    <h2>History</h2>
    <div class="table-wrap">
    <table>
      <thead><tr><th>Job</th><th>Repository</th><th>Status</th><th>Started</th><th>Duration</th><th>Size</th><th>Trigger</th><th>Detail</th></tr></thead>
      <tbody id="history"><tr><td colspan="8" class="muted">No runs yet.</td></tr></tbody>
    </table>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>
<div class="stale" id="stale" hidden></div>

<script>
const BASE = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
const BUILD_VERSION = document.querySelector('meta[name="build-version"]').content;
//: Set once we have already tried reloading at a fresh URL, so a genuine
//: mismatch cannot put the page into a reload loop.
let reloadedForVersion = new URLSearchParams(location.search).has('v');
const api = (path) => BASE + 'api/' + path;
const $ = (id) => document.getElementById(id);

let logOffset = 0;
let followingRunId = null;
let pinnedRunId = null;
let repositoriesSignature = null;
let historySignature = null;
// The poll interval and the post-click refresh can otherwise overlap, and two
// concurrent log pumps interleave their appends.
let refreshing = false;

function toast(message, isError) {
  const el = $('toast');
  el.textContent = message;
  el.classList.toggle('error', !!isError);
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 4000);
}

function bytes(value) {
  if (value === null || value === undefined) return '–';
  const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
  let n = Number(value), i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(1)) + ' ' + units[i];
}

function relative(iso) {
  const date = new Date(iso);
  const diff = (date - Date.now()) / 1000;
  const abs = Math.abs(diff);
  const rel = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
  if (abs < 90) return rel.format(Math.round(diff), 'second');
  if (abs < 3600) return rel.format(Math.round(diff / 60), 'minute');
  if (abs < 86400) return rel.format(Math.round(diff / 3600), 'hour');
  return rel.format(Math.round(diff / 86400), 'day');
}

// Rendered once with the timestamp attached, then refreshed in place by
// paintRelativeTimes. Re-rendering the markup on every tick would destroy the
// buttons inside these cards, and a click landing mid-rebuild would be lost.
function when(iso) {
  if (!iso) return '–';
  return `<span class="rel" data-time="${iso}" title="${new Date(iso).toLocaleString()}">`
    + `${relative(iso)}</span>`;
}

function paintRelativeTimes() {
  document.querySelectorAll('.rel[data-time]').forEach((el) => {
    el.textContent = relative(el.dataset.time);
  });
}

function duration(seconds) {
  if (seconds === null || seconds === undefined) return '–';
  if (seconds < 60) return seconds.toFixed(1) + 's';
  const m = Math.floor(seconds / 60), s = Math.round(seconds % 60);
  if (m < 60) return `${m}m ${s}s`;
  return `${Math.floor(m / 60)}h ${m % 60}m`;
}

const pill = (status) => `<span class="pill ${status}">${status}</span>`;
const JOBS = ['prune', 'check', 'repack'];
const jobTag = (job) =>
  JOBS.includes(job) ? `<span class="tag ${job}">${job}</span>` : escapeHtml(job);

// "5%" and "4/13" are both opaque on their own: one samples afresh every run and
// may never reach some packs, the other covers everything in t runs.
function readScope(value) {
  if (!value) return 'structure only';
  const text = String(value);
  const slice = text.match(/^(\d+)\s*\/\s*(\d+)$/);
  if (slice) return `part ${slice[1]} of ${slice[2]}`;
  if (text.endsWith('%')) return `${text} random sample`;
  return text;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

async function request(path, options) {
  const response = await fetch(api(path), options);
  if (!response.ok) {
    let reason = response.statusText;
    try { reason = (await response.text()) || reason; } catch (_) {}
    throw new Error(reason);
  }
  const type = response.headers.get('content-type') || '';
  return type.includes('json') ? response.json() : response.text();
}

function retentionSummary(retention) {
  const parts = Object.entries(retention)
    .filter(([, value]) => value)
    .map(([key, value]) => `${key.replace('keep_', '')}:${value}`);
  return parts.join(' ') || 'none';
}

function latestUnused(...runs) {
  const measured = runs
    .filter((run) => run && run.metrics && run.metrics.unused_bytes !== undefined)
    .sort((a, b) => String(a.finished_at || '').localeCompare(String(b.finished_at || '')));
  return measured.length ? measured[measured.length - 1].metrics.unused_bytes : undefined;
}

function repositoryCard(repository, running) {
  const prune = repository.jobs.prune;
  const check = repository.jobs.check;
  const repack = repository.jobs.repack;
  const metrics = (prune.last_run && prune.last_run.metrics) || {};
  // Both prune and repack measure unused space, and either can be the newer of
  // the two, so take it from whichever finished last.
  const unused = latestUnused(prune.last_run, repack.last_run);
  const disabled = running ? 'disabled' : '';
  return `<section class="card" data-repository="${escapeHtml(repository.slug)}">
    <div class="card-head">
      <h3>${escapeHtml(repository.name)}</h3>
      <span class="spacer"></span>
      ${pill(prune.last_status)}
    </div>
    <div class="target" style="margin-bottom:10px">${escapeHtml(repository.target)}</div>
    <div class="row"><span>Size</span><span>${bytes(repository.size_bytes)}</span></div>
    <div class="row"><span>Snapshots</span><span>${repository.snapshot_count || '–'}</span></div>
    <div class="row"><span>Retention</span><span class="target">${retentionSummary(repository.retention)}</span></div>
    <div class="split">
      <div>
        <h4>Prune</h4>
        <div class="row"><span>Last</span><span>${prune.last_run ? when(prune.last_run.finished_at || prune.last_run.started_at) : '–'}</span></div>
        <div class="row"><span>Removed</span><span>${metrics.snapshots_removed ?? '–'}</span></div>
        <div class="row"><span>Freed</span><span>${bytes(metrics.bytes_reclaimed)}${metrics.exact_sizes === false ? ' <span class="muted">approx.</span>' : ''}</span></div>
      </div>
      <div>
        <h4>Check ${pill(check.last_status)}</h4>
        <div class="row"><span>Last</span><span>${check.last_run ? when(check.last_run.finished_at || check.last_run.started_at) : '–'}</span></div>
        <div class="row"><span>Verified</span><span>${check.last_run && check.last_run.metrics && check.last_run.metrics.read_data_subset ? escapeHtml(readScope(check.last_run.metrics.read_data_subset)) : '–'}</span></div>
      </div>
      <div>
        <h4>Repack ${pill(repack.last_status)}</h4>
        <div class="row"><span>Last</span><span>${repack.last_run ? when(repack.last_run.finished_at || repack.last_run.started_at) : '–'}</span></div>
        <div class="row"><span>Unused</span><span>${unused === undefined ? '–' : bytes(unused)}</span></div>
      </div>
    </div>
    <div class="actions">
      <button class="primary small" data-run="prune" data-repository="${escapeHtml(repository.slug)}" ${disabled}>Prune</button>
      <button class="small" data-run="prune" data-dry="1" data-repository="${escapeHtml(repository.slug)}" ${disabled}>Prune (dry)</button>
      <button class="small" data-run="check" data-repository="${escapeHtml(repository.slug)}" ${disabled}>Check</button>
      <button class="small" data-run="repack" data-repository="${escapeHtml(repository.slug)}" ${disabled}>Repack</button>
      <button class="small" data-run="repack" data-dry="1" data-repository="${escapeHtml(repository.slug)}" ${disabled}>Repack (dry)</button>
      <button class="small danger" data-unlock="${escapeHtml(repository.slug)}" ${disabled}>Unlock</button>
    </div>
  </section>`;
}

async function refreshStatus() {
  if (refreshing) return;
  refreshing = true;
  try {
    await refreshStatusOnce();
  } finally {
    refreshing = false;
  }
}

async function refreshStatusOnce() {
  let status;
  try {
    status = await request('status');
  } catch (error) {
    $('global-status').className = 'pill failed';
    $('global-status').textContent = 'unreachable';
    return;
  }

  checkForStalePage(status.version);

  const running = status.running;
  $('global-status').className = 'pill ' + (running ? 'running' : 'success');
  $('global-status').textContent = running
    ? `running ${status.current_run.job} on ${status.current_run.repository}`
    : 'idle';
  // Shown so "which version is actually running" is answerable from the page
  // itself, rather than from the add-on log.
  $('version').textContent = status.version ? `v${status.version}` : '';
  $('timezone').textContent = status.timezone;

  $('prune-schedule').textContent = status.jobs.prune.enabled ? status.jobs.prune.schedule : 'disabled';
  $('check-schedule').textContent = status.jobs.check.enabled ? status.jobs.check.schedule : 'disabled';
  $('repack-schedule').textContent = status.jobs.repack.enabled ? status.jobs.repack.schedule : 'disabled';
  $('prune-next').innerHTML = status.jobs.prune.enabled ? when(status.jobs.prune.next_run) : '<span class="muted">disabled</span>';
  $('check-next').innerHTML = status.jobs.check.enabled ? when(status.jobs.check.next_run) : '<span class="muted">disabled</span>';
  $('repack-next').innerHTML = status.jobs.repack.enabled ? when(status.jobs.repack.next_run) : '<span class="muted">disabled</span>';

  // Only rebuild the cards when their content actually changed; see when().
  const signature = JSON.stringify([status.repositories, running]);
  if (signature !== repositoriesSignature) {
    repositoriesSignature = signature;
    $('repositories').innerHTML = status.repositories
      .map((repository) => repositoryCard(repository, running))
      .join('');
  }

  document.querySelectorAll('#card-schedule [data-run]').forEach((button) => {
    const job = button.dataset.run;
    button.disabled = running || !status.jobs[job].enabled;
  });
  paintRelativeTimes();

  if (running) {
    if (followingRunId !== status.current_run.id) {
      followingRunId = status.current_run.id;
      pinnedRunId = null;
      logOffset = 0;
      $('log').textContent = '';
      $('log-title').textContent =
        `Live log – ${status.current_run.job} on ${status.current_run.repository}`;
    }
    await pumpLiveLog();
  } else if (followingRunId) {
    followingRunId = null;
    await pumpLiveLog();
  }
  await refreshHistory();
}

async function pumpLiveLog() {
  if (pinnedRunId) return;
  try {
    const data = await request('live?offset=' + logOffset);
    if (data.lines.length) {
      const el = $('log');
      const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
      el.textContent += (el.textContent ? '\n' : '') + data.lines.join('\n');
      if (atBottom) el.scrollTop = el.scrollHeight;
    }
    logOffset = data.offset;
  } catch (error) { /* transient; the next tick retries */ }
}

// A framed page can be served from cache indefinitely: reloading the parent
// document does not revalidate a subframe, so the panel can keep rendering a
// previous release while the add-on underneath it has moved on. The page knows
// which version it was built from and the API says which is running, so the
// mismatch is detectable -- and fixable, by reloading at a URL the cache has
// never seen.
function checkForStalePage(liveVersion) {
  if (!liveVersion || liveVersion === BUILD_VERSION) return;
  if (!reloadedForVersion) {
    reloadedForVersion = true;
    location.replace(BASE + '?v=' + encodeURIComponent(liveVersion));
    return;
  }
  const stale = $('stale');
  stale.hidden = false;
  stale.innerHTML =
    `This page was built from v${escapeHtml(BUILD_VERSION)} but the add-on is running ` +
    `v${escapeHtml(liveVersion)}. Your browser is showing a cached copy — ` +
    `right-click the panel and choose <strong>Reload frame</strong>.`;
}

// -- charts -----------------------------------------------------------------
//
// Hand-rolled SVG on purpose: this page is a single self-contained document with
// no build step and no dependencies, and a few polylines do not justify changing
// that. Points are spaced by time, not by index, so a gap in the schedule shows
// as a gap.
//
// Drawn with uniform scaling. The obvious trick for a responsive chart --
// preserveAspectRatio="none" -- stretches the drawing to the card's width, and
// would stretch the axis labels along with it, so the height follows the width
// instead and every chart in a row ends up the same size anyway.

// The viewBox is sized so that one unit is about one pixel at the width these
// cards actually get, which keeps the label text at a sane size.
const CHART_W = 320;
const CHART_H = 140;
const PLOT_L = 48;  // left gutter: y tick labels
const PLOT_R = 8;
const PLOT_T = 8;
const PLOT_B = 18;  // bottom gutter: the first and last date
const PLOT_W = CHART_W - PLOT_L - PLOT_R;
const PLOT_H = CHART_H - PLOT_T - PLOT_B;
const HOVER_RADIUS = 22;  // in viewBox units

// Ticks have to be round in the unit the value is *printed* in: 2 GiB and 4 GiB,
// not 2.1 GB, and 30m rather than 1800s. So each axis picks one unit for the whole
// scale, steps in multiples of it, and labels every tick in it -- an axis reading
// 0 B / 500.0 MiB / 1.5 GiB is three units for one column of numbers.
const BYTE_UNITS = [[1024 ** 4, 'TiB'], [1024 ** 3, 'GiB'], [1024 ** 2, 'MiB'], [1024, 'KiB'], [1, 'B']];

function inUnit(value, unit, name) {
  const scaled = value / unit;
  return (Number.isInteger(scaled) ? scaled : scaled.toFixed(1)) + name;
}

const BYTES_AXIS = {
  format: bytes,
  unit: (high) => { let u = 1; while (high / u >= 1024 && u < 1024 ** 4) u *= 1024; return u; },
  tick: (value, unit) => inUnit(value, unit, ' ' + BYTE_UNITS.find(([size]) => size === unit)[1]),
};
const TIME_AXIS = {
  format: duration,
  unit: (high) => (high >= 7200 ? 3600 : high >= 120 ? 60 : 1),
  tick: (value, unit) => inUnit(value, unit, unit === 3600 ? 'h' : unit === 60 ? 'm' : 's'),
};

function niceStep(raw) {
  if (!(raw > 0)) return 1;
  const magnitude = 10 ** Math.floor(Math.log10(raw));
  const scaled = raw / magnitude;
  return (scaled > 5 ? 10 : scaled > 2 ? 5 : scaled > 1 ? 2 : 1) * magnitude;
}

// Round values covering [low, high], with the outermost two becoming the axis
// bounds so a line never runs along the frame.
function niceTicks(low, high, unit) {
  const step = niceStep((high - low) / unit / 4) * unit;
  const first = Math.floor(low / step) * step;
  const ticks = [];
  for (let value = first; value < high + step / 2 && ticks.length < 8; value += step) {
    ticks.push(value);
  }
  ticks.push(ticks.length ? ticks[ticks.length - 1] + step : high);
  return ticks;
}

const shortDate = (ms) =>
  new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

// Every rendered chart keeps its hit points here, indexed by the data-chart
// attribute on its element, so the hover handler can work off the drawn geometry
// rather than re-deriving it.
const chartModels = [];

function lineChart(series, axis, title) {
  // A single point is a dot, not a trend: a series only counts once it has two.
  const drawn = series.filter((s) => s.points.length > 1);
  const all = drawn.flatMap((s) => s.points);
  if (all.length < 2) {
    // Still take a slot, so the data-chart index of every later chart is right.
    chartModels.push({ hits: [], format: axis.format, multi: false });
    return '<p class="muted">Not enough points yet.</p>';
  }

  const xs = all.map((p) => p.x);
  const ys = all.map((p) => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const low = Math.min(...ys), high = Math.max(...ys);
  // A series that never moves still deserves a line, drawn down the middle --
  // but it must not be labelled with the padding invented to draw it.
  const flat = low === high;
  const unit = axis.unit(Math.max(Math.abs(low), Math.abs(high)));
  const ticks = flat ? [low] : niceTicks(low, high, unit);
  const y0 = flat ? low - 1 : ticks[0];
  const y1 = flat ? high + 1 : ticks[ticks.length - 1];
  const spanX = x1 - x0 || 1;
  const px = (x) => PLOT_L + ((x - x0) / spanX) * PLOT_W;
  const py = (y) => PLOT_T + PLOT_H - ((y - y0) / (y1 - y0)) * PLOT_H;

  const grid = ticks.map((value) => `
    <line x1="${PLOT_L}" y1="${py(value).toFixed(1)}" x2="${PLOT_L + PLOT_W}" y2="${py(value).toFixed(1)}"
          stroke="currentColor" stroke-width="0.5" opacity="${value === ticks[0] ? 0.25 : 0.12}"/>
    <text class="tick" x="${PLOT_L - 6}" y="${(py(value) + 3.2).toFixed(1)}" text-anchor="end">${escapeHtml(axis.tick(value, unit))}</text>`
  ).join('');

  const hits = [];
  const lines = drawn
    .map((s) => {
      const path = s.points.map((p) => {
        const point = { x: px(p.x), y: py(p.y), value: p.y, time: p.x, label: s.label, color: s.color };
        hits.push(point);
        return point;
      });
      const d = path.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
      const dots = path
        .map((p) => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="1.6" fill="${s.color}" opacity="0.5"/>`)
        .join('');
      const last = path[path.length - 1];
      return `<polyline fill="none" stroke="${s.color}" stroke-width="1.6"
                stroke-linejoin="round" stroke-linecap="round" points="${d}"/>
              ${dots}
              <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="2.5" fill="${s.color}"/>`;
    })
    .join('');

  const range = flat ? `${axis.format(low)} throughout` : `${axis.format(low)} – ${axis.format(high)}`;
  const summary = `${title}: ${range}, ${shortDate(x0)} to ${shortDate(x1)}`
    + (drawn.length > 1 ? `, one line per ${drawn.map((s) => s.label).join(', ')}` : '');

  chartModels.push({ hits, format: axis.format, multi: drawn.length > 1 });

  return `<svg viewBox="0 0 ${CHART_W} ${CHART_H}" role="img" aria-label="${escapeHtml(summary)}">
    ${grid}
    <line class="guide" x1="0" y1="${PLOT_T}" x2="0" y2="${PLOT_T + PLOT_H}"
          stroke="currentColor" stroke-width="0.6" opacity="0"/>
    ${lines}
    <circle class="focus" r="3.4" fill="var(--card)" stroke-width="1.8" opacity="0"/>
    <text class="tick" x="${PLOT_L}" y="${CHART_H - 4}">${escapeHtml(shortDate(x0))}</text>
    ${shortDate(x0) === shortDate(x1) ? '' : `<text class="tick" x="${PLOT_L + PLOT_W}" y="${CHART_H - 4}" text-anchor="end">${escapeHtml(shortDate(x1))}</text>`}
  </svg>
  <div class="tip" hidden aria-hidden="true"></div>
  <div class="span">${escapeHtml(range)}</div>`;
}

function legend(series) {
  const shown = series.filter((s) => s.points.length > 1);
  if (shown.length < 2) return '';
  return `<div class="legend">${shown
    .map((s) => `<span><i style="background:${s.color}"></i>${escapeHtml(s.label)}</span>`)
    .join('')}</div>`;
}

function chart(title, series, axis) {
  const body = lineChart(series, axis, title);
  const index = chartModels.length - 1;
  return `<div class="chart" data-chart="${index}">`
    + `<h4>${escapeHtml(title)}</h4>${body}${legend(series)}</div>`;
}

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#888';
}

// Repositories, unlike jobs, are named by the user, so their colours are assigned
// in name order rather than fixed. Two lines the legend calls different things
// have to look different.
const SERIES_COLORS = ['--accent', '--series-2', '--series-3', '--series-4'];

function repositoryColors(points) {
  const names = [...new Set(points.map((point) => point.repository))].sort();
  const colors = new Map(
    names.map((name, i) => [name, cssVar(SERIES_COLORS[i % SERIES_COLORS.length])]),
  );
  return (name) => colors.get(name) || cssVar('--accent');
}

function seriesBy(points, key, field, colorFor) {
  const groups = new Map();
  for (const point of points) {
    const value = point[field];
    if (value === null || value === undefined) continue;
    const name = point[key];
    if (!groups.has(name)) groups.set(name, []);
    groups.get(name).push({ x: Date.parse(point.finished_at), y: value });
  }
  return [...groups.entries()].map(([name, pts]) => ({
    label: name,
    color: colorFor(name),
    points: pts.filter((p) => Number.isFinite(p.x)),
  }));
}

// -- reading a point off the curve ------------------------------------------
//
// The three jobs finish at different times, so there is no shared x to line the
// series up on: the readout snaps to the single nearest run and names it, rather
// than inventing a column of values that never happened at the same moment.

function chartPoint(svg, event) {
  const point = svg.createSVGPoint();
  point.x = event.clientX;
  point.y = event.clientY;
  const ctm = svg.getScreenCTM();
  return ctm ? point.matrixTransform(ctm.inverse()) : null;
}

function hideChartTip(element) {
  if (!element) return;
  const tip = element.querySelector('.tip');
  if (tip) tip.hidden = true;
  const guide = element.querySelector('.guide');
  if (guide) guide.setAttribute('opacity', '0');
  const focus = element.querySelector('.focus');
  if (focus) focus.setAttribute('opacity', '0');
}

let hoveredChart = null;

function onChartHover(event) {
  const element = event.target.closest('.chart[data-chart]');
  if (element !== hoveredChart) hideChartTip(hoveredChart);
  hoveredChart = element;
  if (!element) return;

  const svg = element.querySelector('svg');
  const model = chartModels[Number(element.dataset.chart)];
  if (!svg || !model || !model.hits.length) return;
  const cursor = chartPoint(svg, event);
  if (!cursor) return;

  let nearest = null, best = Infinity;
  for (const hit of model.hits) {
    const distance = Math.hypot(hit.x - cursor.x, (hit.y - cursor.y) * 0.6);
    if (distance < best) { best = distance; nearest = hit; }
  }
  if (!nearest || best > HOVER_RADIUS) { hideChartTip(element); return; }

  const guide = element.querySelector('.guide');
  guide.setAttribute('x1', nearest.x.toFixed(1));
  guide.setAttribute('x2', nearest.x.toFixed(1));
  guide.setAttribute('opacity', '0.3');
  const focus = element.querySelector('.focus');
  focus.setAttribute('cx', nearest.x.toFixed(1));
  focus.setAttribute('cy', nearest.y.toFixed(1));
  focus.setAttribute('stroke', nearest.color);
  focus.setAttribute('opacity', '1');

  const tip = element.querySelector('.tip');
  tip.innerHTML = `<strong>${escapeHtml(model.format(nearest.value))}</strong>`
    + (model.multi ? `<span class="who">${escapeHtml(nearest.label)}</span>` : '')
    + `<span class="who">${escapeHtml(new Date(nearest.time).toLocaleString())}</span>`;
  tip.hidden = false;

  // The svg scales uniformly and fills the card's width, so one viewBox unit is
  // the same number of pixels in both directions.
  const box = element.getBoundingClientRect();
  const rect = svg.getBoundingClientRect();
  const scale = rect.width / CHART_W;
  const left = rect.left - box.left + nearest.x * scale;
  const top = rect.top - box.top + nearest.y * scale;
  tip.style.left = Math.max(2, Math.min(left - tip.offsetWidth / 2, box.width - tip.offsetWidth - 2)) + 'px';
  const above = top - tip.offsetHeight - 10 >= 0;
  tip.classList.toggle('below', !above);
  tip.style.top = (above ? top - 10 : top + 10) + 'px';
}

async function refreshTrends() {
  let data;
  try { data = await request('trends'); } catch (error) { return; }
  const points = data.points;
  const el = $('charts');
  hideChartTip(hoveredChart);
  hoveredChart = null;
  chartModels.length = 0;
  if (points.length < 2) {
    el.innerHTML = '<p class="muted">Not enough finished runs yet.</p>';
    return;
  }
  const repoColor = repositoryColors(points);
  const jobColor = (job) => cssVar('--job-' + job);
  el.innerHTML =
    chart('Repository size', seriesBy(points, 'repository', 'repo_size_after', repoColor), BYTES_AXIS) +
    chart('Unused space', seriesBy(points, 'repository', 'unused_bytes', repoColor), BYTES_AXIS) +
    chart('Run duration', seriesBy(points, 'job', 'duration_seconds', jobColor), TIME_AXIS);
}

async function refreshHistory() {
  let data;
  try { data = await request('runs?limit=25'); } catch (error) { return; }
  const signature = JSON.stringify(data.runs);
  if (signature === historySignature) return;
  historySignature = signature;
  // Only when the history actually moved: the poll loop runs every few seconds
  // and the whole series is far too much to re-pull that often.
  await refreshTrends();

  const body = $('history');
  if (!data.runs.length) {
    body.innerHTML = '<tr><td colspan="8" class="muted">No runs yet.</td></tr>';
    return;
  }
  body.innerHTML = data.runs.map((run) => {
    const detail = run.error
      ? `<span class="muted">${escapeHtml(run.error.split('\n')[0]).slice(0, 80)}</span>`
      : (run.job === 'prune' || run.job === 'repack') && run.metrics.bytes_reclaimed !== undefined
        ? `${run.metrics.snapshots_removed !== undefined ? `${run.metrics.snapshots_removed} removed · ` : ''}${bytes(run.metrics.bytes_reclaimed)} freed`
        : run.job === 'check' && run.metrics.read_data_subset
          ? `${escapeHtml(readScope(run.metrics.read_data_subset))}${run.metrics.snapshot_count !== undefined ? ` · ${run.metrics.snapshot_count} snapshots` : ''}`
          : '';
    return `<tr data-run-id="${run.id}">
      <td>${jobTag(run.job)}${run.dry_run ? ' <span class="muted">(dry)</span>' : ''}</td>
      <td>${escapeHtml(run.repository)}</td>
      <td>${pill(run.status)}</td>
      <td>${when(run.started_at)}</td>
      <td>${duration(run.duration_seconds)}</td>
      <td>${run.metrics.repo_size_after === undefined ? '–' : bytes(run.metrics.repo_size_after)}</td>
      <td class="muted">${run.trigger}</td>
      <td>${detail}</td>
    </tr>`;
  }).join('');
  paintRelativeTimes();
}

document.addEventListener('click', async (event) => {
  const runButton = event.target.closest('[data-run]');
  if (runButton) {
    const job = runButton.dataset.run;
    const dry = runButton.dataset.dry === '1';
    const repository = runButton.dataset.repository || null;
    runButton.disabled = true;
    try {
      await request(`jobs/${job}/run`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dry_run: dry, repository }),
      });
      toast(`${job}${dry ? ' (dry run)' : ''} started${repository ? ' on ' + repository : ''}`);
      pinnedRunId = null;
      setTimeout(refreshStatus, 400);
    } catch (error) {
      toast(error.message, true);
      runButton.disabled = false;
    }
    return;
  }

  const unlockButton = event.target.closest('[data-unlock]');
  if (unlockButton) {
    const repository = unlockButton.dataset.unlock;
    if (!confirm(`Remove stale restic locks on "${repository}"?\n\nOnly do this when you are sure no other restic process is running against it.`)) return;
    try {
      await request('unlock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ repository, remove_all: false }),
      });
      toast('Stale locks removed');
    } catch (error) {
      toast(error.message, true);
    }
    return;
  }

  const row = event.target.closest('tr[data-run-id]');
  if (row) {
    const runId = row.dataset.runId;
    pinnedRunId = runId;
    $('log-title').textContent = 'Log – ' + runId.slice(0, 8);
    try {
      $('log').textContent = await request(`runs/${runId}/log`);
      $('log').scrollTop = 0;
    } catch (error) {
      // Logs rotate out well before run records do, so an old run in the table
      // legitimately has no log left.
      $('log').textContent =
        'The full log for this run is no longer kept. Its summary is in the history row.';
    }
  }
});

// Delegated, because refreshTrends rebuilds the charts whenever the history moves
// and per-chart listeners would not survive it.
$('charts').addEventListener('pointermove', onChartHover);
$('charts').addEventListener('pointerleave', () => { hideChartTip(hoveredChart); hoveredChart = null; });
$('charts').addEventListener('pointercancel', () => { hideChartTip(hoveredChart); hoveredChart = null; });

refreshStatus();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
