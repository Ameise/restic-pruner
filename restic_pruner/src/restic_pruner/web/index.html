<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restic Pruner</title>
<!-- The version this page was built from. Compared at runtime against what the
     add-on reports, so a page served from a stale cache can notice and say so.
     Kept in step with the other version strings by scripts/check_versions.py. -->
<meta name="build-version" content="0.5.0">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --card: #ffffff;
    --border: #e2e5ea;
    --text: #1b1f24;
    --muted: #6b7280;
    --accent: #03a9f4;
    --ok: #2e7d32;
    --fail: #c62828;
    /* One colour per job, used by the history tags and the duration chart so a
       line and a row are recognisably the same thing. */
    --job-prune: #1e88e5;
    --job-check: #8e24aa;
    --job-repack: #ef6c00;
    /* One colour per repository in the size charts. --accent is the first, so a
       single-repository install looks exactly as it did. */
    --series-2: #00897b;
    --series-3: #d81b60;
    --series-4: #7cb342;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418;
      --card: #1b1f24;
      --border: #2c3138;
      --text: #e6e8eb;
      --muted: #9aa3ad;
      --ok: #66bb6a;
      --fail: #ef5350;
      --job-prune: #64b5f6;
      --job-check: #ce93d8;
      --job-repack: #ffb74d;
      --series-2: #4db6ac;
      --series-3: #f06292;
      --series-4: #aed581;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 13px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  h3 { font-size: 16px; margin: 0; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .card { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .card-head .spacer { flex: 1; }
  .target { font-family: var(--mono); font-size: 12px; color: var(--muted); word-break: break-all; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 14px; }
  .row > span:first-child { color: var(--muted); }
  .row > span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .stale {
    position: fixed; inset: 0 0 auto 0; z-index: 20;
    padding: 10px 16px; text-align: center; font-size: 13px;
    background: var(--fail); color: #fff;
  }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  .chart { position: relative; }
  .chart h4 { margin: 0 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  /* Height follows width: the drawing scales uniformly so the axis labels inside
     it keep their shape. */
  .chart svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
  .chart svg text.tick { font-size: 9.5px; fill: var(--muted); font-family: inherit; }
  .chart .tip {
    position: absolute; z-index: 5; pointer-events: none;
    transform: translateY(-100%);
    background: var(--card); border: 1px solid var(--border); border-radius: 7px;
    padding: 5px 8px; font-size: 11.5px; line-height: 1.35; white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,.16); font-variant-numeric: tabular-nums;
  }
  .chart .tip.below { transform: none; }
  /* The charts that are echoing a run read off a neighbour say so by saying it more
     quietly, so the one being asked stays the one being read. */
  .chart .tip.linked { opacity: .72; border-style: dashed; }
  .chart .tip strong { display: block; font-size: 13px; }
  .chart .tip .who { display: block; color: var(--muted); }
  button.scale {
    font: inherit; font-size: 10px; letter-spacing: .03em;
    margin-left: 8px; padding: 1px 7px; border-radius: 999px;
    border: 1px solid var(--border); background: none; color: var(--muted);
    cursor: pointer; text-transform: none;
  }
  button.scale:hover { border-color: var(--accent); color: var(--accent); }
  button.scale[aria-pressed="true"] {
    border-color: var(--accent); background: var(--accent); color: #fff;
  }
  /* The overlay is one chart for the whole row, whatever the auto-fit would
     otherwise have done with a lone child. */
  .chart.wide { grid-column: 1 / -1; }
  .chart .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .chart .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: baseline; }
  /* In the overlay the dash pattern is what says which of the three readings a line
     is, so the legend shows a scrap of the line rather than a plain square. */
  .chart .legend svg.dash {
    display: inline-block; width: 18px; height: 6px;
    margin-right: 4px; vertical-align: middle;
  }
  .chart .span { font-size: 11px; color: var(--muted); }
  /* Name, overall status and target in one frame, so it is clear the pill up here
     describes the repository and not the first job listed under it. */
  .identity {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 12px;
  }
  .identity .card-head { margin-bottom: 4px; }
  .jobs { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 12px; }
  /* Each job is its own block: stacked on a narrow card they would otherwise read
     as more of the rows above them. The left edge is the job's colour, the same one
     the history tags and the duration chart use. */
  .job {
    background: var(--bg); border: 1px solid var(--border); border-left: 3px solid var(--border);
    border-radius: 8px; padding: 8px 10px;
  }
  .job.prune { border-left-color: var(--job-prune); }
  .job.check { border-left-color: var(--job-check); }
  .job.repack { border-left-color: var(--job-repack); }
  .job h4 {
    margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); font-weight: 600;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .job .row { font-size: 13px; }
  .pill {
    display: inline-flex; align-items: center;
    padding: 2px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em;
    border: 1px solid currentColor;
  }
  .tag {
    display: inline-flex; align-items: center;
    padding: 2px 8px; border-radius: 5px;
    font-size: 11px; font-weight: 600; letter-spacing: .03em;
    color: #fff;
  }
  .tag.prune { background: var(--job-prune); }
  .tag.check { background: var(--job-check); }
  .tag.repack { background: var(--job-repack); }
  .pill.success { color: var(--ok); }
  .pill.failed { color: var(--fail); }
  .pill.running { color: var(--accent); }
  .pill.skipped, .pill.never { color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  button {
    font: inherit; font-size: 14px;
    padding: 7px 13px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { color: #fff; filter: brightness(1.08); }
  button.danger:hover:not(:disabled) { border-color: var(--fail); color: var(--fail); }
  button.small { font-size: 13px; padding: 5px 10px; }
  /* Out of the way until wanted: a section's copy button appears when the
     section is hovered. Hidden with opacity rather than display so it keeps its
     place in the tab order, and shows itself once focused. */
  button.copy {
    position: absolute; top: 12px; right: 12px; z-index: 1;
    font-size: 11px; letter-spacing: .03em; padding: 2px 8px; border-radius: 999px;
    color: var(--muted); opacity: 0; transition: opacity .15s;
  }
  .card:hover button.copy, button.copy:focus-visible, button.copy.done { opacity: 1; }
  button.copy.done { border-color: var(--ok); color: var(--ok); }
  /* Where the button would land on top of something -- the header's version and
     timezone, a repository's status pill -- it still costs them no space at rest.
     It stays out of the flow, and the run beside it slides aside to uncover it
     while the pointer is in that corner. The slide's margin widens .meta, so the
     uncovered strip is inside the hover zone and the pointer can cross onto the
     button without the strip closing under it. --copy-slide is the button's own
     width, which CSS cannot measure, so each context states it. */
  .meta { position: relative; display: flex; align-items: center; gap: 12px; }
  .meta > button.copy { top: 50%; right: 0; transform: translateY(-50%); }
  .meta .slide { display: flex; align-items: center; gap: 12px;
                 margin-right: 0; transition: margin-right .15s ease; }
  .meta:hover .slide, .meta:focus-within .slide { margin-right: var(--copy-slide); }
  .meta:hover button.copy, .meta:focus-within button.copy { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .meta .slide { transition: none; } }
  /* The run under the pointer, spelled out as the row the history table would give
     it. Framed, because it belongs to the charts above rather than to the card. */
  #trend-readout {
    margin-top: 14px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 10px;
  }
  #trend-readout.pinned { border-color: var(--accent); }
  #trend-readout .readout-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 12px;
  }
  #trend-readout .readout-head .spacer { flex: 1; }
  #trend-readout table { min-width: 560px; }
  #trend-readout th { padding-bottom: 4px; }
  #trend-readout td { border: 0; }
  #trend-readout tbody tr { cursor: default; }
  pre.log {
    margin: 0; padding: 12px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.45;
    max-height: 340px; overflow: auto; white-space: pre-wrap; word-break: break-word;
  }
  /* Eight columns do not fit a phone. Scroll the table inside its card rather
     than letting the whole page scroll sideways. */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px;
       text-transform: uppercase; letter-spacing: .04em; padding-bottom: 8px; }
  /* A button rather than a click handler on the th, so the sort is reachable by
     keyboard and shows a focus ring without inventing either. */
  button.sort {
    font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit;
    background: none; border: 0; padding: 0; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }
  button.sort:hover { color: var(--accent); }
  button.sort .arrow { font-size: 10px; opacity: .45; }
  th[aria-sort] button.sort { color: var(--text); }
  th[aria-sort] button.sort .arrow { opacity: 1; color: var(--accent); }
  select {
    font: inherit; font-size: 13px;
    padding: 5px 8px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    cursor: pointer;
  }
  select:hover { border-color: var(--accent); }
  td { padding: 7px 8px 7px 0; border-top: 1px solid var(--border); }
  tbody tr { cursor: pointer; }
  /* The three jobs run as a weekly cluster. Banding by calendar week draws each
     cluster as one block instead of three unrelated rows. Ahead of the hover
     rule, which has the same specificity and should win. */
  tbody tr.week-band { background: color-mix(in srgb, var(--text) 6%, transparent); }
  tbody tr:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .full { grid-column: 1 / -1; }
  .muted { color: var(--muted); }
  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 16px; box-shadow: 0 6px 24px rgba(0,0,0,.18);
    opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--fail); color: var(--fail); }
</style>
</head>
<body>
<header>
  <h1>Restic Pruner</h1>
  <span id="global-status" class="pill never">loading</span>
  <span class="spacer" style="flex:1"></span>
  <span class="meta" style="--copy-slide:64px">
    <span class="slide">
      <span class="target" id="version"></span>
      <span class="target" id="timezone"></span>
    </span>
    <button class="copy" type="button" data-copy="all"
            title="Copy the whole dashboard as Markdown">⧉ copy</button>
  </span>
</header>

<div class="grid">
  <section class="card full" id="card-schedule">
    <h2>Schedule</h2>
    <div class="split">
      <div>
        <div class="row"><span>Prune</span><span id="prune-schedule" class="target"></span></div>
        <div class="row"><span>Next prune</span><span id="prune-next">–</span></div>
      </div>
      <div>
        <div class="row"><span>Check</span><span id="check-schedule" class="target"></span></div>
        <div class="row"><span>Next check</span><span id="check-next">–</span></div>
      </div>
      <div>
        <div class="row"><span>Repack</span><span id="repack-schedule" class="target"></span></div>
        <div class="row"><span>Next repack</span><span id="repack-next">–</span></div>
      </div>
    </div>
    <div class="actions">
      <button class="primary" data-run="prune">Prune all now</button>
      <button data-run="prune" data-dry="1">Prune (dry run)</button>
      <button data-run="check">Check all now</button>
      <button data-run="repack">Repack all now</button>
      <button data-run="repack" data-dry="1">Repack (dry run)</button>
    </div>
  </section>

  <div class="full grid" id="repositories"></div>

  <section class="card full" id="card-trends">
    <button class="copy" type="button" data-copy="trends" title="Copy the trends as Markdown">⧉ copy</button>
    <div class="card-head">
      <h2 style="margin:0">Trends</h2>
      <button class="scale" id="view-overlay" type="button" aria-pressed="false"
              title="Draw all three trends on one chart: sizes against the left axis, durations against the right">overlay</button>
    </div>
    <div class="charts" id="charts">
      <p class="muted">Not enough finished runs yet.</p>
    </div>
    <!-- The run under the pointer, or the pinned one, as the row the history table
         would give it. A point on a chart is a number; this is what it was. -->
    <div id="trend-readout" hidden>
      <div class="readout-head">
        <span id="readout-what" class="muted">The run under the pointer</span>
        <span class="spacer"></span>
        <button id="unpin" class="small" type="button" hidden>✕ unpin</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Job</th><th>Repository</th><th>Status</th><th>Started</th>
            <th>Duration</th><th>Size</th><th>Trigger</th><th>Detail</th>
          </tr></thead>
          <tbody id="readout-row"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="card full" id="card-log">
    <button class="copy" type="button" data-copy="log" title="Copy this log">⧉ copy</button>
    <h2><span id="log-title">Log</span></h2>
    <pre class="log" id="log">No run selected.</pre>
  </section>

  <section class="card full">
    <div class="card-head">
      <h2 style="margin:0">History</h2>
      <span class="spacer"></span>
      <span class="meta" style="--copy-slide:64px">
        <span class="slide">
          <label class="muted" for="history-job" style="font-size:12px">Job</label>
          <select id="history-job">
            <option value="">All jobs</option>
            <option value="prune">prune</option>
            <option value="check">check</option>
            <option value="repack">repack</option>
          </select>
        </span>
        <button class="copy" type="button" data-copy="history" title="Copy the history table as Markdown">⧉ copy</button>
      </span>
    </div>
    <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Job</th><th>Repository</th><th>Status</th>
        <th data-sort="started"><button class="sort" type="button">Started<span class="arrow">↕</span></button></th>
        <th data-sort="duration"><button class="sort" type="button">Duration<span class="arrow">↕</span></button></th>
        <th data-sort="size"><button class="sort" type="button">Size<span class="arrow">↕</span></button></th>
        <th>Trigger</th><th>Detail</th>
      </tr></thead>
      <tbody id="history"><tr><td colspan="8" class="muted">No runs yet.</td></tr></tbody>
    </table>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>
<div class="stale" id="stale" hidden></div>

<script>
const BASE = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
const BUILD_VERSION = document.querySelector('meta[name="build-version"]').content;
//: Set once we have already tried reloading at a fresh URL, so a genuine
//: mismatch cannot put the page into a reload loop.
let reloadedForVersion = new URLSearchParams(location.search).has('v');
const api = (path) => BASE + 'api/' + path;
const $ = (id) => document.getElementById(id);

let logOffset = 0;
let followingRunId = null;
let pinnedRunId = null;
let repositoriesSignature = null;
let historySignature = null;
//: The runs the table is currently showing, kept so a sort or a re-sort repaints
//: without another round trip.
let historyRuns = [];
//: '' for every job. Changing it refetches, because the API filters server-side
//: and 25 rows of one job beats whatever survives hiding rows of 25 mixed ones.
let historyJob = '';
//: Wikipedia's three states: null is the order the API served, newest first.
let historySort = { column: null, ascending: false };
//: The filter the painted table was fetched under, to tell a moved history from a
//: changed dropdown.
let historyFilterShown = null;
// The poll interval and the post-click refresh can otherwise overlap, and two
// concurrent log pumps interleave their appends.
let refreshing = false;
//: The most recent /api/status document. refreshStatusOnce paints straight from
//: its local copy; the copy buttons need to reach it later, out of band.
let latestStatus = null;

function toast(message, isError) {
  const el = $('toast');
  el.textContent = message;
  el.classList.toggle('error', !!isError);
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 4000);
}

function bytes(value) {
  if (value === null || value === undefined) return '–';
  const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
  let n = Number(value), i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(1)) + ' ' + units[i];
}

function relative(iso) {
  const date = new Date(iso);
  const diff = (date - Date.now()) / 1000;
  const abs = Math.abs(diff);
  const rel = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
  if (abs < 90) return rel.format(Math.round(diff), 'second');
  if (abs < 3600) return rel.format(Math.round(diff / 60), 'minute');
  if (abs < 86400) return rel.format(Math.round(diff / 3600), 'hour');
  return rel.format(Math.round(diff / 86400), 'day');
}

// Rendered once with the timestamp attached, then refreshed in place by
// paintRelativeTimes. Re-rendering the markup on every tick would destroy the
// buttons inside these cards, and a click landing mid-rebuild would be lost.
function when(iso) {
  if (!iso) return '–';
  return `<span class="rel" data-time="${iso}" title="${new Date(iso).toLocaleString()}">`
    + `${relative(iso)}</span>`;
}

function paintRelativeTimes() {
  document.querySelectorAll('.rel[data-time]').forEach((el) => {
    el.textContent = relative(el.dataset.time);
  });
}

function duration(seconds) {
  if (seconds === null || seconds === undefined) return '–';
  if (seconds < 60) return seconds.toFixed(1) + 's';
  const m = Math.floor(seconds / 60), s = Math.round(seconds % 60);
  if (m < 60) return `${m}m ${s}s`;
  return `${Math.floor(m / 60)}h ${m % 60}m`;
}

const pill = (status) => `<span class="pill ${status}">${status}</span>`;
const JOBS = ['prune', 'check', 'repack'];
const jobTag = (job) =>
  JOBS.includes(job) ? `<span class="tag ${job}">${job}</span>` : escapeHtml(job);

// The card's own pill answers "is anything wrong with this repository", so the
// worst of the three jobs wins. A failure has to survive the two other jobs
// succeeding after it.
const STATUS_ORDER = ['failed', 'running', 'success', 'skipped', 'never'];
const overallStatus = (jobs) =>
  STATUS_ORDER.find((status) => JOBS.some((job) => jobs[job].last_status === status)) || 'never';

// "5%" and "4/13" are both opaque on their own: one samples afresh every run and
// may never reach some packs, the other covers everything in t runs.
function readScope(value) {
  if (!value) return 'structure only';
  const text = String(value);
  const slice = text.match(/^(\d+)\s*\/\s*(\d+)$/);
  if (slice) return `part ${slice[1]} of ${slice[2]}`;
  if (text.endsWith('%')) return `${text} random sample`;
  return text;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

async function request(path, options) {
  const response = await fetch(api(path), options);
  if (!response.ok) {
    let reason = response.statusText;
    try { reason = (await response.text()) || reason; } catch (_) {}
    throw new Error(reason);
  }
  const type = response.headers.get('content-type') || '';
  return type.includes('json') ? response.json() : response.text();
}

function retentionSummary(retention) {
  const parts = Object.entries(retention)
    .filter(([, value]) => value)
    .map(([key, value]) => `${key.replace('keep_', '')}:${value}`);
  return parts.join(' ') || 'none';
}

function latestUnused(...runs) {
  const measured = runs
    .filter((run) => run && run.metrics && run.metrics.unused_bytes !== undefined)
    .sort((a, b) => String(a.finished_at || '').localeCompare(String(b.finished_at || '')));
  return measured.length ? measured[measured.length - 1].metrics.unused_bytes : undefined;
}

// -- copying ----------------------------------------------------------------
//
// The dashboard as text, for pasting into a notebook or a chat. Markdown rather
// than the raw API JSON: it says the same thing in a fraction of the words, and
// every timestamp is absolute -- "7 days ago" means nothing once it has left the
// page that was computing it.

async function copyText(text) {
  // Two ways this fails on a perfectly ordinary install, which is why the old
  // execCommand path is still here and is still reached on a throw rather than
  // only on a missing API:
  //   - navigator.clipboard needs a secure context, and ingress over plain HTTP
  //     on a LAN address is not one, so the API is simply absent;
  //   - Home Assistant frames the add-on without allow="clipboard-write", so on
  //     an HTTPS install the API is present and rejects.
  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(text);
      return;
    } catch (error) {
      // fall through
    }
  }
  const area = document.createElement('textarea');
  area.value = text;
  area.setAttribute('readonly', '');
  area.style.cssText = 'position:fixed;top:-1000px;opacity:0';
  document.body.appendChild(area);
  area.select();
  const copied = document.execCommand('copy');
  area.remove();
  if (!copied) throw new Error('the browser refused the copy');
}

const at = (iso) => (iso ? new Date(iso).toISOString() : '–');
const mdCell = (value) =>
  String(value === null || value === undefined || value === '' ? '–' : value).replace(/\|/g, '\\|');

function mdTable(headers, rows) {
  return [
    '| ' + headers.join(' | ') + ' |',
    '| ' + headers.map(() => '---').join(' | ') + ' |',
    ...rows.map((row) => '| ' + row.map(mdCell).join(' | ') + ' |'),
  ].join('\n');
}

function markdownRepository(repository) {
  const jobs = repository.jobs;
  const pruneMetrics = (jobs.prune.last_run && jobs.prune.last_run.metrics) || {};
  const checkMetrics = (jobs.check.last_run && jobs.check.last_run.metrics) || {};
  const unused = latestUnused(jobs.prune.last_run, jobs.repack.last_run);
  const lastOf = (job) => {
    const run = jobs[job].last_run;
    return run ? at(run.finished_at || run.started_at) : '–';
  };
  return [
    `### ${repository.name} (${repository.slug})`,
    '',
    `- Repository: ${repository.target}`,
    `- Size: ${bytes(repository.size_bytes)}`,
    `- Snapshots: ${repository.snapshot_count ?? '–'}`,
    `- Retention: ${retentionSummary(repository.retention)}`,
    '',
    mdTable(['Job', 'Status', 'Last run (UTC)', 'Detail'], [
      ['prune', jobs.prune.last_status, lastOf('prune'),
        `${pruneMetrics.snapshots_removed ?? '–'} removed · ${bytes(pruneMetrics.bytes_reclaimed)} freed`
        + (pruneMetrics.exact_sizes === false ? ' (approx.)' : '')],
      ['check', jobs.check.last_status, lastOf('check'),
        checkMetrics.read_data_subset ? readScope(checkMetrics.read_data_subset) : '–'],
      ['repack', jobs.repack.last_status, lastOf('repack'),
        `unused ${unused === undefined ? '–' : bytes(unused)}`],
    ]),
  ].join('\n');
}

function markdownStatus(status) {
  if (!status) return '## Status\n\n_Not loaded yet._';
  const schedule = (job) => (status.jobs[job].enabled
    ? `\`${status.jobs[job].schedule}\`, next ${at(status.jobs[job].next_run)}`
    : 'disabled');
  return [
    '## Status',
    '',
    `- Version: ${status.version}`,
    `- Timezone: ${status.timezone}`,
    `- Running: ${status.running
      ? `${status.current_run.job} on ${status.current_run.repository}`
      : 'idle'}`,
    '',
    '### Schedule',
    '',
    ...JOBS.map((job) => `- ${job}: ${schedule(job)}`),
    '',
    '## Repositories',
    '',
    status.repositories.map(markdownRepository).join('\n\n'),
  ].join('\n');
}

//: The charts in words: a summary line per series, then a short tail. Several
//: hundred raw points is the wrong thing to paste, and the shape of the last few
//: runs is the part anyone is asking about.
const TREND_TAIL = 6;

function markdownTrends(points) {
  if (points.length < 2) return '## Trends\n\n_Not enough finished runs yet._';
  const uncolored = () => '';
  const sections = [
    ['Repository size', seriesBy(points, 'repository', 'repo_size_after', uncolored), bytes],
    ['Unused space', seriesBy(points, 'repository', 'unused_bytes', uncolored), bytes],
    ['Run duration', seriesBy(points, 'job', 'duration_seconds', uncolored), duration],
  ];
  const lines = ['## Trends', ''];
  for (const [title, series, format] of sections) {
    lines.push(`### ${title}`, '');
    for (const entry of series) {
      if (!entry.points.length) continue;
      const values = entry.points.map((point) => point.y);
      lines.push(`- **${entry.label}** — ${values.length} runs, `
        + `${format(Math.min(...values))} to ${format(Math.max(...values))}`);
      lines.push('  - latest: ' + entry.points.slice(-TREND_TAIL)
        .map((point) => `${new Date(point.x).toISOString().slice(0, 10)} ${format(point.y)}`)
        .join(' · '));
    }
    lines.push('');
  }
  return lines.join('\n').trimEnd();
}

function markdownHistory(runs) {
  if (!runs.length) return '## History\n\n_No runs._';
  return [
    '## History',
    '',
    `${historyJob ? `${historyJob} runs only` : 'All jobs'}, newest first, times in UTC.`,
    '',
    mdTable(
      ['Job', 'Repository', 'Status', 'Started', 'Duration', 'Size after', 'Trigger', 'Detail'],
      runs.map((run) => [
        run.job + (run.dry_run ? ' (dry)' : ''),
        run.repository,
        run.status,
        at(run.started_at),
        duration(run.duration_seconds),
        run.metrics.repo_size_after === undefined ? '–' : bytes(run.metrics.repo_size_after),
        run.trigger,
        historyDetail(run),
      ]),
    ),
  ].join('\n');
}

function markdownLog() {
  const text = $('log').textContent.trim();
  const title = $('log-title').textContent;
  return text ? `## ${title}\n\n\`\`\`\n${text}\n\`\`\`` : `## ${title}\n\n_Empty._`;
}

function markdownAll() {
  return [
    '# Restic Pruner',
    '',
    `Copied ${new Date().toISOString()}.`,
    '',
    markdownStatus(latestStatus),
    '',
    markdownTrends(trendPoints),
    '',
    markdownHistory(sortedHistory()),
  ].join('\n');
}

//: What each copy button copies. Keyed by its data-copy value.
const COPY_SOURCES = {
  all: () => markdownAll(),
  trends: () => markdownTrends(trendPoints),
  history: () => markdownHistory(sortedHistory()),
  log: () => markdownLog(),
  repository: (button) => {
    const repositories = latestStatus ? latestStatus.repositories : [];
    const repository = repositories.find((entry) => entry.slug === button.dataset.repository);
    return repository ? markdownRepository(repository) : null;
  },
};

function repositoryCard(repository, running) {
  const prune = repository.jobs.prune;
  const check = repository.jobs.check;
  const repack = repository.jobs.repack;
  const metrics = (prune.last_run && prune.last_run.metrics) || {};
  // Both prune and repack measure unused space, and either can be the newer of
  // the two, so take it from whichever finished last.
  const unused = latestUnused(prune.last_run, repack.last_run);
  const disabled = running ? 'disabled' : '';
  return `<section class="card" data-repository="${escapeHtml(repository.slug)}">
    <div class="identity">
      <div class="card-head">
        <h3>${escapeHtml(repository.name)}</h3>
        <span class="spacer"></span>
        <span class="meta" style="--copy-slide:28px">
          <span class="slide">${pill(overallStatus(repository.jobs))}</span>
          <button class="copy" type="button" data-copy="repository" data-repository="${escapeHtml(repository.slug)}" title="Copy this repository as Markdown">⧉</button>
        </span>
      </div>
      <div class="target">${escapeHtml(repository.target)}</div>
    </div>
    <div class="row"><span>Size</span><span>${bytes(repository.size_bytes)}</span></div>
    <div class="row"><span>Snapshots</span><span>${repository.snapshot_count || '–'}</span></div>
    <div class="row"><span>Retention</span><span class="target">${retentionSummary(repository.retention)}</span></div>
    <div class="jobs">
      <div class="job prune">
        <h4>Prune ${pill(prune.last_status)}</h4>
        <div class="row"><span>Last</span><span>${prune.last_run ? when(prune.last_run.finished_at || prune.last_run.started_at) : '–'}</span></div>
        <div class="row"><span>Removed</span><span>${metrics.snapshots_removed ?? '–'}</span></div>
        <div class="row"><span>Freed</span><span>${bytes(metrics.bytes_reclaimed)}${metrics.exact_sizes === false ? ' <span class="muted">approx.</span>' : ''}</span></div>
      </div>
      <div class="job check">
        <h4>Check ${pill(check.last_status)}</h4>
        <div class="row"><span>Last</span><span>${check.last_run ? when(check.last_run.finished_at || check.last_run.started_at) : '–'}</span></div>
        <div class="row"><span>Verified</span><span>${check.last_run && check.last_run.metrics && check.last_run.metrics.read_data_subset ? escapeHtml(readScope(check.last_run.metrics.read_data_subset)) : '–'}</span></div>
      </div>
      <div class="job repack">
        <h4>Repack ${pill(repack.last_status)}</h4>
        <div class="row"><span>Last</span><span>${repack.last_run ? when(repack.last_run.finished_at || repack.last_run.started_at) : '–'}</span></div>
        <div class="row"><span>Unused</span><span>${unused === undefined ? '–' : bytes(unused)}</span></div>
      </div>
    </div>
    <div class="actions">
      <button class="primary small" data-run="prune" data-repository="${escapeHtml(repository.slug)}" ${disabled}>Prune</button>
      <button class="small" data-run="prune" data-dry="1" data-repository="${escapeHtml(repository.slug)}" ${disabled}>Prune (dry)</button>
      <button class="small" data-run="check" data-repository="${escapeHtml(repository.slug)}" ${disabled}>Check</button>
      <button class="small" data-run="repack" data-repository="${escapeHtml(repository.slug)}" ${disabled}>Repack</button>
      <button class="small" data-run="repack" data-dry="1" data-repository="${escapeHtml(repository.slug)}" ${disabled}>Repack (dry)</button>
      <button class="small danger" data-unlock="${escapeHtml(repository.slug)}" ${disabled}>Unlock</button>
    </div>
  </section>`;
}

async function refreshStatus() {
  if (refreshing) return;
  refreshing = true;
  try {
    await refreshStatusOnce();
  } finally {
    refreshing = false;
  }
}

async function refreshStatusOnce() {
  let status;
  try {
    status = await request('status');
  } catch (error) {
    $('global-status').className = 'pill failed';
    $('global-status').textContent = 'unreachable';
    return;
  }

  latestStatus = status;
  checkForStalePage(status.version);

  const running = status.running;
  $('global-status').className = 'pill ' + (running ? 'running' : 'success');
  $('global-status').textContent = running
    ? `running ${status.current_run.job} on ${status.current_run.repository}`
    : 'idle';
  // Shown so "which version is actually running" is answerable from the page
  // itself, rather than from the add-on log.
  $('version').textContent = status.version ? `v${status.version}` : '';
  $('timezone').textContent = status.timezone;

  $('prune-schedule').textContent = status.jobs.prune.enabled ? status.jobs.prune.schedule : 'disabled';
  $('check-schedule').textContent = status.jobs.check.enabled ? status.jobs.check.schedule : 'disabled';
  $('repack-schedule').textContent = status.jobs.repack.enabled ? status.jobs.repack.schedule : 'disabled';
  $('prune-next').innerHTML = status.jobs.prune.enabled ? when(status.jobs.prune.next_run) : '<span class="muted">disabled</span>';
  $('check-next').innerHTML = status.jobs.check.enabled ? when(status.jobs.check.next_run) : '<span class="muted">disabled</span>';
  $('repack-next').innerHTML = status.jobs.repack.enabled ? when(status.jobs.repack.next_run) : '<span class="muted">disabled</span>';

  // Only rebuild the cards when their content actually changed; see when().
  const signature = JSON.stringify([status.repositories, running]);
  if (signature !== repositoriesSignature) {
    repositoriesSignature = signature;
    $('repositories').innerHTML = status.repositories
      .map((repository) => repositoryCard(repository, running))
      .join('');
  }

  document.querySelectorAll('#card-schedule [data-run]').forEach((button) => {
    const job = button.dataset.run;
    button.disabled = running || !status.jobs[job].enabled;
  });
  paintRelativeTimes();

  if (running) {
    if (followingRunId !== status.current_run.id) {
      followingRunId = status.current_run.id;
      pinnedRunId = null;
      logOffset = 0;
      $('log').textContent = '';
      $('log-title').textContent =
        `Live log – ${status.current_run.job} on ${status.current_run.repository}`;
    }
    await pumpLiveLog();
  } else if (followingRunId) {
    followingRunId = null;
    await pumpLiveLog();
  }
  await refreshHistory();
}

async function pumpLiveLog() {
  if (pinnedRunId) return;
  try {
    const data = await request('live?offset=' + logOffset);
    if (data.lines.length) {
      const el = $('log');
      const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
      el.textContent += (el.textContent ? '\n' : '') + data.lines.join('\n');
      if (atBottom) el.scrollTop = el.scrollHeight;
    }
    logOffset = data.offset;
  } catch (error) { /* transient; the next tick retries */ }
}

// A framed page can be served from cache indefinitely: reloading the parent
// document does not revalidate a subframe, so the panel can keep rendering a
// previous release while the add-on underneath it has moved on. The page knows
// which version it was built from and the API says which is running, so the
// mismatch is detectable -- and fixable, by reloading at a URL the cache has
// never seen.
function checkForStalePage(liveVersion) {
  if (!liveVersion || liveVersion === BUILD_VERSION) return;
  if (!reloadedForVersion) {
    reloadedForVersion = true;
    location.replace(BASE + '?v=' + encodeURIComponent(liveVersion));
    return;
  }
  const stale = $('stale');
  stale.hidden = false;
  stale.innerHTML =
    `This page was built from v${escapeHtml(BUILD_VERSION)} but the add-on is running ` +
    `v${escapeHtml(liveVersion)}. Your browser is showing a cached copy — ` +
    `right-click the panel and choose <strong>Reload frame</strong>.`;
}

// -- charts -----------------------------------------------------------------
//
// Hand-rolled SVG on purpose: this page is a single self-contained document with
// no build step and no dependencies, and a few polylines do not justify changing
// that. Points are spaced by time, not by index, so a gap in the schedule shows
// as a gap.
//
// Drawn with uniform scaling. The obvious trick for a responsive chart --
// preserveAspectRatio="none" -- stretches the drawing to the card's width, and
// would stretch the axis labels along with it, so the height follows the width
// instead and every chart in a row ends up the same size anyway.

// The viewBox is sized so that one unit is about one pixel at the width these
// cards actually get, which keeps the label text at a sane size.
const CHART_W = 320;
const CHART_H = 140;
const PLOT_L = 48;  // left gutter: y tick labels
const PLOT_R = 8;
const PLOT_T = 8;
const PLOT_B = 18;  // bottom gutter: the first and last date
const PLOT_W = CHART_W - PLOT_L - PLOT_R;
const PLOT_H = CHART_H - PLOT_T - PLOT_B;
const HOVER_RADIUS = 22;  // in viewBox units

// Ticks have to be round in the unit the value is *printed* in: 2 GiB and 4 GiB,
// not 2.1 GB, and 30m rather than 1800s. So each axis picks one unit for the whole
// scale, steps in multiples of it, and labels every tick in it -- an axis reading
// 0 B / 500.0 MiB / 1.5 GiB is three units for one column of numbers.
const BYTE_UNITS = [[1024 ** 4, 'TiB'], [1024 ** 3, 'GiB'], [1024 ** 2, 'MiB'], [1024, 'KiB'], [1, 'B']];

function inUnit(value, unit, name) {
  const scaled = value / unit;
  return (Number.isInteger(scaled) ? scaled : scaled.toFixed(1)) + name;
}

const BYTES_AXIS = {
  format: bytes,
  unit: (high) => { let u = 1; while (high / u >= 1024 && u < 1024 ** 4) u *= 1024; return u; },
  tick: (value, unit) => inUnit(value, unit, ' ' + BYTE_UNITS.find(([size]) => size === unit)[1]),
  // A log axis climbs by 1024 rather than by 10, so its rungs are the units people
  // already read sizes in -- 4 MiB, 64 MiB, 1 GiB -- rather than 1-2-5 decades
  // that would label a size chart in powers of a thousand it never uses. Each rung
  // is labelled in its own unit, since the axis crosses several.
  ladder: { base: 1024, multiples: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512] },
  logLabel: (value) => BYTES_AXIS.tick(value, BYTES_AXIS.unit(value)),
};
const TIME_AXIS = {
  format: duration,
  unit: (high) => (high >= 7200 ? 3600 : high >= 120 ? 60 : 1),
  tick: (value, unit) => inUnit(value, unit, unit === 3600 ? 'h' : unit === 60 ? 'm' : 's'),
  // Durations are not decimal: the rungs worth labelling are the ones a clock has,
  // so the ladder is spelled out rather than generated from a base.
  ladder: [1, 2, 5, 15, 30, 60, 300, 900, 1800, 3600, 7200, 21600, 43200, 86400, 604800],
  logLabel: (value) =>
    value < 60 ? inUnit(value, 1, 's') : value < 3600 ? inUnit(value, 60, 'm') : inUnit(value, 3600, 'h'),
};

function niceStep(raw) {
  if (!(raw > 0)) return 1;
  const magnitude = 10 ** Math.floor(Math.log10(raw));
  const scaled = raw / magnitude;
  return (scaled > 5 ? 10 : scaled > 2 ? 5 : scaled > 1 ? 2 : 1) * magnitude;
}

// Round values covering [low, high], with the outermost two becoming the axis
// bounds so a line never runs along the frame.
function niceTicks(low, high, unit) {
  const step = niceStep((high - low) / unit / 4) * unit;
  const first = Math.floor(low / step) * step;
  const ticks = [];
  for (let value = first; value < high + step / 2 && ticks.length < 8; value += step) {
    ticks.push(value);
  }
  ticks.push(ticks.length ? ticks[ticks.length - 1] + step : high);
  return ticks;
}

// A log axis is laid out on its own ladder of rungs -- powers of two for sizes, the
// ones a clock has for durations -- extended to the rungs either side of the data so
// a line never runs along the frame. Rungs are labelled each in its own unit, since
// an axis crossing decades genuinely wants mixed ones: 30s, 5m, 1h.
function ladderRungs(low, high, axis) {
  if (Array.isArray(axis.ladder)) return axis.ladder;
  const { base, multiples } = axis.ladder;
  const rungs = [];
  // Start a full step below the data, so a rung at or under `low` always exists.
  let magnitude = base ** (Math.floor(Math.log(low) / Math.log(base)) - 1);
  while (magnitude <= high * base && rungs.length < 128) {
    for (const multiple of multiples) rungs.push(multiple * magnitude);
    magnitude *= base;
  }
  return rungs;
}

function logTicks(low, high, axis, unit) {
  const rungs = ladderRungs(low, high, axis);
  if (rungs.filter((value) => value >= low && value <= high).length < 2) {
    // The data spans less than one rung: the ladder would squeeze it into a sliver
    // between two distant labels. Over so short a range a log axis is barely
    // distinguishable from a linear one anyway, so borrow the linear axis's round
    // numbers and merely place them logarithmically.
    const ticks = niceTicks(low, high, unit).filter((value) => value > 0);
    if (ticks.length >= 2) return { ticks, label: (value) => axis.tick(value, unit) };
  }
  let first = 0, last = rungs.length - 1;
  for (let i = 0; i < rungs.length; i++) if (rungs[i] <= low) first = i;
  for (let i = rungs.length - 1; i >= 0; i--) if (rungs[i] >= high) last = i;
  let ticks = rungs.slice(first, Math.max(last, first + 1) + 1);
  // Six labels is all the gutter can carry; drop every other rung until they fit,
  // keeping the one that is the axis's top bound.
  while (ticks.length > 6) {
    ticks = ticks.filter((_, i) => i % 2 === 0 || i === ticks.length - 1);
  }
  return { ticks, label: axis.logLabel };
}

const shortDate = (ms) =>
  new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

// Every rendered chart keeps its hit points here, indexed by the data-chart
// attribute on its element, so the hover handler can work off the drawn geometry
// rather than re-deriving it.
const chartModels = [];

// The stretches of a series that a log axis can draw, split where a run at or below
// zero had to be left out.
function aboveZero(points) {
  const segments = [];
  let current = [];
  for (const point of points) {
    if (point.y > 0) {
      current.push(point);
    } else if (current.length) {
      segments.push(current);
      current = [];
    }
  }
  if (current.length) segments.push(current);
  return segments;
}

// Two boxes to draw in: the narrow one is a third of the row, the wide one is the
// overlay, which takes the whole row and keeps a second gutter on the right for the
// axis its durations are read off.
function plotBox(width, height, right) {
  return {
    width, height, left: PLOT_L, top: PLOT_T,
    plotW: width - PLOT_L - right,
    plotH: height - PLOT_T - PLOT_B,
  };
}
const NARROW_BOX = plotBox(CHART_W, CHART_H, PLOT_R);
const WIDE_BOX = plotBox(660, 250, 56);

// A single point is a dot, not a trend: a series only counts once it has two. A log
// axis has no place for zero, and unused space legitimately reaches it; those runs
// are left out rather than pressed onto the bottom tick, where a 0 B run would be
// indistinguishable from a 1 KiB one -- and the caption says how many went missing.
function drawable(series, log) {
  const full = series.filter((s) => s.points.length > 1);
  const dropped = log ? full.flatMap((s) => s.points).filter((p) => p.y <= 0).length : 0;
  const drawn = (log
    ? full
      .map((s) => ({ ...s, points: s.points.filter((p) => p.y > 0), segments: aboveZero(s.points) }))
      .filter((s) => s.points.length > 1)
    : full.map((s) => ({ ...s, segments: [s.points] })));
  return { drawn, dropped };
}

// One y axis: where a value sits in the box, which ticks to label, and how to label
// them. Its own function because the overlay hangs two of these off one set of
// lines, bytes on the left and seconds on the right.
function buildScale(values, axis, log, box) {
  const low = Math.min(...values), high = Math.max(...values);
  // A series that never moves still deserves a line, drawn down the middle --
  // but it must not be labelled with the padding invented to draw it.
  const flat = low === high;
  const unit = axis.unit(Math.max(Math.abs(low), Math.abs(high)));
  const ladder = flat || !log ? null : logTicks(low, high, axis, unit);
  const ticks = flat ? [low] : log ? ladder.ticks : niceTicks(low, high, unit);
  const y0 = flat ? (log ? low / 2 : low - 1) : ticks[0];
  const y1 = flat ? (log ? high * 2 : high + 1) : ticks[ticks.length - 1];
  // The only difference a log axis makes to the drawing: values are placed by
  // their logarithm, so a tenfold rise is the same distance wherever it starts.
  const place = log
    ? (y) => (Math.log10(y) - Math.log10(y0)) / (Math.log10(y1) - Math.log10(y0))
    : (y) => (y - y0) / (y1 - y0);
  return {
    ticks, format: axis.format,
    py: (y) => box.top + box.plotH - place(y) * box.plotH,
    label: (value) => (ladder ? ladder.label(value) : axis.tick(value, unit)),
    range: flat ? `${axis.format(low)} throughout` : `${axis.format(low)} – ${axis.format(high)}`,
  };
}

function timePlacer(x0, x1, box) {
  const span = x1 - x0 || 1;
  return (x) => box.left + ((x - x0) / span) * box.plotW;
}

// Horizontal rules, labelled down the left gutter -- or, for the overlay's second
// axis, labelled down the right one and drawing no rules, since one grid is all a
// chart can carry without the two sets of lines being mistaken for each other.
function gridLines(scale, box, side) {
  const right = side === 'right';
  return scale.ticks.map((value) => {
    const y = scale.py(value).toFixed(1);
    const rule = right ? '' : `
    <line x1="${box.left}" y1="${y}" x2="${box.left + box.plotW}" y2="${y}"
          stroke="currentColor" stroke-width="0.5" opacity="${value === scale.ticks[0] ? 0.25 : 0.12}"/>`;
    return `${rule}
    <text class="tick" x="${right ? box.left + box.plotW + 6 : box.left - 6}"
          y="${(scale.py(value) + 3.2).toFixed(1)}"
          text-anchor="${right ? 'start' : 'end'}">${escapeHtml(scale.label(value))}</text>`;
  }).join('');
}

// One series drawn, with its points recorded as hits so the hover handler works off
// the drawn geometry rather than re-deriving it. A hit carries the id of the run it
// was read from -- which is how a readout finds the same run in the other charts --
// and its own formatter, because the overlay puts bytes and seconds on one picture.
function plotSeries(s, px, scale, hits) {
  const path = s.points.map((p) => {
    const point = {
      x: px(p.x), y: scale.py(p.y), value: p.y, time: p.x,
      run: p.run, label: s.label, color: s.color, format: scale.format,
    };
    hits.push(point);
    return point;
  });
  // One polyline per run of consecutive drawn points. Off a log axis that is
  // the whole series; on one, the line stops either side of a dropped zero
  // rather than sailing over a value that is not there.
  const dash = s.dash ? ` stroke-dasharray="${s.dash}"` : '';
  const strokes = s.segments
    .filter((segment) => segment.length > 1)
    .map((segment) => segment.map((p) => `${px(p.x).toFixed(1)},${scale.py(p.y).toFixed(1)}`).join(' '))
    .map((points) => `<polyline fill="none" stroke="${s.color}" stroke-width="1.6"
            stroke-linejoin="round" stroke-linecap="round"${dash} points="${points}"/>`)
    .join('');
  const dots = path
    .map((p) => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="1.6" fill="${s.color}" opacity="0.5"/>`)
    .join('');
  const last = path[path.length - 1];
  return `${strokes}
          ${dots}
          <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="2.5" fill="${s.color}"/>`;
}

// The moving parts every chart carries: the guide the pointer drags along, the ring
// on the point being read, and a second ring that stays on a pinned run while the
// pointer wanders off to read something else.
const markers = (box) => `<line class="guide" x1="0" y1="${box.top}" x2="0" y2="${box.top + box.plotH}"
          stroke="currentColor" stroke-width="0.6" opacity="0"/>`;
const RINGS = `<circle class="pinned" r="4.6" fill="none" stroke-width="1.2" opacity="0"/>
    <circle class="focus" r="3.4" fill="var(--card)" stroke-width="1.8" opacity="0"/>`;

function chartSvg(box, x0, x1, body, summary) {
  return `<svg viewBox="0 0 ${box.width} ${box.height}" role="img" aria-label="${escapeHtml(summary)}">
    ${body}
    <text class="tick" x="${box.left}" y="${box.height - 4}">${escapeHtml(shortDate(x0))}</text>
    ${shortDate(x0) === shortDate(x1) ? '' : `<text class="tick" x="${box.left + box.plotW}" y="${box.height - 4}" text-anchor="end">${escapeHtml(shortDate(x1))}</text>`}
  </svg>`;
}

const nothingToPlot = (log) => (log
  ? '<p class="muted">Nothing above zero to plot on a log scale.</p>'
  : '<p class="muted">Not enough points yet.</p>');

function lineChart(series, axis, title, log) {
  const { drawn, dropped } = drawable(series, log);
  const all = drawn.flatMap((s) => s.points);
  if (all.length < 2) {
    // Still take a slot, so the data-chart index of every later chart is right.
    chartModels.push({ hits: [], multi: false });
    return nothingToPlot(log);
  }
  const box = NARROW_BOX;
  const xs = all.map((p) => p.x);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const px = timePlacer(x0, x1, box);
  const scale = buildScale(all.map((p) => p.y), axis, log, box);

  const hits = [];
  const lines = drawn.map((s) => plotSeries(s, px, scale, hits)).join('');
  const notes = (log ? ['log scale'] : [])
    .concat(dropped ? [`${dropped} at ${axis.format(0)} not shown`] : []);
  const caption = [scale.range].concat(notes).join(' · ');
  const summary = `${title}: ${caption}, ${shortDate(x0)} to ${shortDate(x1)}`
    + (drawn.length > 1 ? `, one line per ${drawn.map((s) => s.label).join(', ')}` : '');

  chartModels.push({ hits, multi: drawn.length > 1 });

  const body = gridLines(scale, box) + markers(box) + lines + RINGS;
  return chartSvg(box, x0, x1, body, summary)
    + '<div class="tip" hidden aria-hidden="true"></div>'
    + `<div class="span">${escapeHtml(caption)}</div>`;
}

// -- all three at once ------------------------------------------------------
//
// The three charts are three readings of the same runs, so they can be laid over
// one another -- but bytes and seconds cannot share a scale, and pretending they
// can is how a chart lies. They do not: sizes are read off the left axis, durations
// off the right. Colour keeps the meaning it has in the split view, one per
// repository for the sizes and one per job for the durations, and the dash pattern
// says which of the three readings a line is.
const OVERLAY_DASH = { size: '', unused: '5 3', duration: '1.5 2.5' };

function overlaySeries(points) {
  const repoColor = repositoryColors(points);
  const jobColor = (job) => cssVar('--job-' + job);
  const tag = (metric, series) => series.map((s) => ({
    ...s, metric, dash: OVERLAY_DASH[metric], label: `${s.label} · ${metric}`,
  }));
  return {
    bytes: tag('size', seriesBy(points, 'repository', 'repo_size_after', repoColor))
      .concat(tag('unused', seriesBy(points, 'repository', 'unused_bytes', repoColor))),
    time: tag('duration', seriesBy(points, 'job', 'duration_seconds', jobColor)),
  };
}

function overlayChart(points, log) {
  const grouped = overlaySeries(points);
  const bytesSide = drawable(grouped.bytes, log);
  const timeSide = drawable(grouped.time, log);
  const drawn = bytesSide.drawn.concat(timeSide.drawn);
  const all = drawn.flatMap((s) => s.points);
  if (all.length < 2) {
    chartModels.push({ hits: [], multi: false });
    return { body: nothingToPlot(log), series: [] };
  }

  const box = WIDE_BOX;
  const xs = all.map((p) => p.x);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const px = timePlacer(x0, x1, box);
  const scaleFor = (side, axis) => (side.drawn.length
    ? buildScale(side.drawn.flatMap((s) => s.points).map((p) => p.y), axis, log, box)
    : null);
  const bytesScale = scaleFor(bytesSide, BYTES_AXIS);
  const timeScale = scaleFor(timeSide, TIME_AXIS);
  // With only one of the two present there is no second axis to make room for, and
  // the grid belongs on the left where every other chart keeps it.
  const timeAxis = bytesScale ? 'right' : 'left';

  const hits = [];
  const lines = bytesSide.drawn.map((s) => plotSeries(s, px, bytesScale, hits)).join('')
    + timeSide.drawn.map((s) => plotSeries(s, px, timeScale, hits)).join('');
  const grid = (bytesScale ? gridLines(bytesScale, box, 'left') : '')
    + (timeScale ? gridLines(timeScale, box, timeAxis) : '');

  // The left axis carries sizes and unused space together, so the caption names the
  // unit rather than either of the two readings drawn against it.
  const notes = (bytesScale ? [`bytes ${bytesScale.range} on the left`] : [])
    .concat(timeScale ? [`durations ${timeScale.range} on the ${timeAxis}`] : [])
    .concat(log ? ['log scale'] : [])
    .concat(bytesSide.dropped + timeSide.dropped
      ? [`${bytesSide.dropped + timeSide.dropped} at zero not shown`] : []);
  const caption = notes.join(' · ');
  const summary = `All three trends: ${caption}, ${shortDate(x0)} to ${shortDate(x1)}`;

  chartModels.push({ hits, multi: true });

  const body = grid + markers(box) + lines + RINGS;
  return {
    body: chartSvg(box, x0, x1, body, summary)
      + '<div class="tip" hidden aria-hidden="true"></div>'
      + `<div class="span">${escapeHtml(caption)}</div>`,
    series: drawn,
  };
}

// A plain square where every line in the legend looks the same, and a scrap of the
// line itself once the dash pattern is carrying meaning of its own.
function swatch(s) {
  if (!s.metric) return `<i style="background:${s.color}"></i>`;
  const dash = s.dash ? ` stroke-dasharray="${s.dash}"` : '';
  return `<svg class="dash" viewBox="0 0 18 6" aria-hidden="true"><line x1="0" y1="3" x2="18" y2="3"
    stroke="${s.color}" stroke-width="2"${dash}/></svg>`;
}

function legend(series) {
  const shown = series.filter((s) => s.points.length > 1);
  if (shown.length < 2) return '';
  return `<div class="legend">${shown
    .map((s) => `<span>${swatch(s)}${escapeHtml(s.label)}</span>`)
    .join('')}</div>`;
}

function chart(key, title, series, axis) {
  const log = !!logScale[key];
  const body = lineChart(series, axis, title, log);
  const index = chartModels.length - 1;
  const toggle = `<button class="scale" type="button" data-scale="${key}" aria-pressed="${log}"
      title="Plot this chart on a logarithmic y axis">log</button>`;
  return `<div class="chart" data-chart="${index}">`
    + `<h4>${escapeHtml(title)}${toggle}</h4>${body}${legend(series)}</div>`;
}

function overlayView(points) {
  const log = !!logScale.overlay;
  const { body, series } = overlayChart(points, log);
  const index = chartModels.length - 1;
  const toggle = `<button class="scale" type="button" data-scale="overlay" aria-pressed="${log}"
      title="Plot both axes logarithmically">log</button>`;
  return `<div class="chart wide" data-chart="${index}">`
    + `<h4>All three trends${toggle}</h4>${body}${legend(series)}</div>`;
}

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#888';
}

// Repositories, unlike jobs, are named by the user, so their colours are assigned
// in name order rather than fixed. Two lines the legend calls different things
// have to look different.
const SERIES_COLORS = ['--accent', '--series-2', '--series-3', '--series-4'];

function repositoryColors(points) {
  const names = [...new Set(points.map((point) => point.repository))].sort();
  const colors = new Map(
    names.map((name, i) => [name, cssVar(SERIES_COLORS[i % SERIES_COLORS.length])]),
  );
  return (name) => colors.get(name) || cssVar('--accent');
}

// Every plotted point carries `run`, the id of the run it was read off. One run
// contributes a point to each chart that has a number for it, which is what lets a
// readout in one chart find its counterpart in the others.
function seriesBy(points, key, field, colorFor) {
  const groups = new Map();
  for (const point of points) {
    const value = point[field];
    if (value === null || value === undefined) continue;
    const name = point[key];
    if (!groups.has(name)) groups.set(name, []);
    groups.get(name).push({ x: Date.parse(point.finished_at), y: value, run: point.id });
  }
  return [...groups.entries()].map(([name, pts]) => ({
    label: name,
    color: colorFor(name),
    points: pts.filter((p) => Number.isFinite(p.x)),
  }));
}

// -- reading a point off the curve ------------------------------------------
//
// The three jobs finish at different times, so within a chart there is no shared x
// to line the series up on: the readout snaps to the single nearest run and names
// it, rather than inventing a column of values that never happened at the same
// moment. Between charts the thing held in common is not a moment but the run
// itself, so the readout carries that run's id to every other chart and each one
// lights up its own point for it -- or none, where that run recorded no such
// number.

function chartPoint(svg, event) {
  const point = svg.createSVGPoint();
  point.x = event.clientX;
  point.y = event.clientY;
  const ctm = svg.getScreenCTM();
  return ctm ? point.matrixTransform(ctm.inverse()) : null;
}

const chartElements = () => [...document.querySelectorAll('.chart[data-chart]')];

function hideChartTip(element) {
  if (!element) return;
  const tip = element.querySelector('.tip');
  if (tip) tip.hidden = true;
  const guide = element.querySelector('.guide');
  if (guide) guide.setAttribute('opacity', '0');
  const focus = element.querySelector('.focus');
  if (focus) focus.setAttribute('opacity', '0');
}

function hideAllChartTips() {
  chartElements().forEach(hideChartTip);
  hoveredChart = null;
}

let hoveredChart = null;

// The run nearest the pointer in one chart, or null when the pointer is not close
// enough to any of them to be pointing at one.
function nearestHit(element, event) {
  const svg = element.querySelector('svg');
  const model = chartModels[Number(element.dataset.chart)];
  if (!svg || !model || !model.hits.length) return null;
  const cursor = chartPoint(svg, event);
  if (!cursor) return null;
  let nearest = null, best = Infinity;
  for (const hit of model.hits) {
    const distance = Math.hypot(hit.x - cursor.x, (hit.y - cursor.y) * 0.6);
    if (distance < best) { best = distance; nearest = hit; }
  }
  return nearest && best <= HOVER_RADIUS ? nearest : null;
}

// One chart's guide, ring and tip put on one hit. `linked` marks the charts that are
// only echoing a run read off a neighbour, so the one under the pointer still reads
// as the one being asked.
function paintChartReadout(element, hit, linked) {
  const model = chartModels[Number(element.dataset.chart)];
  const svg = element.querySelector('svg');
  if (!svg || !model) return;

  const guide = element.querySelector('.guide');
  guide.setAttribute('x1', hit.x.toFixed(1));
  guide.setAttribute('x2', hit.x.toFixed(1));
  guide.setAttribute('opacity', linked ? '0.16' : '0.3');
  const focus = element.querySelector('.focus');
  focus.setAttribute('cx', hit.x.toFixed(1));
  focus.setAttribute('cy', hit.y.toFixed(1));
  focus.setAttribute('stroke', hit.color);
  focus.setAttribute('opacity', linked ? '0.65' : '1');

  const tip = element.querySelector('.tip');
  tip.classList.toggle('linked', linked);
  tip.innerHTML = `<strong>${escapeHtml(hit.format(hit.value))}</strong>`
    + (model.multi ? `<span class="who">${escapeHtml(hit.label)}</span>` : '')
    + `<span class="who">${escapeHtml(new Date(hit.time).toLocaleString())}</span>`;
  tip.hidden = false;

  // The svg scales uniformly and fills the card's width, so one viewBox unit is
  // the same number of pixels in both directions.
  const box = element.getBoundingClientRect();
  const rect = svg.getBoundingClientRect();
  const scale = rect.width / svg.viewBox.baseVal.width;
  const left = rect.left - box.left + hit.x * scale;
  const top = rect.top - box.top + hit.y * scale;
  tip.style.left = Math.max(2, Math.min(left - tip.offsetWidth / 2, box.width - tip.offsetWidth - 2)) + 'px';
  const above = top - tip.offsetHeight - 10 >= 0;
  tip.classList.toggle('below', !above);
  tip.style.top = (above ? top - 10 : top + 10) + 'px';
}

// One run read out across every chart at once. `source` is the chart the pointer is
// in, if any, and `sourceHit` the point it actually snapped to -- in the overlay one
// run has up to three points in the same chart, and the one under the pointer is the
// one that was asked for. A chart with no point for this run says nothing rather
// than showing a neighbouring run instead.
function showRun(runId, source, sourceHit) {
  for (const element of chartElements()) {
    const model = chartModels[Number(element.dataset.chart)];
    const hit = (element === source && sourceHit)
      || (model && model.hits.find((h) => h.run === runId));
    if (!hit) { hideChartTip(element); continue; }
    paintChartReadout(element, hit, element !== source);
  }
  showReadout(runId);
}

function onChartHover(event) {
  const element = event.target.closest('.chart[data-chart]');
  if (!element) return;
  hoveredChart = element;
  const hit = nearestHit(element, event);
  if (!hit) {
    // Off the lines but still inside the card: fall back to whatever is pinned,
    // rather than leaving a readout for a point the pointer has left behind.
    if (pinnedTrendRun) showRun(pinnedTrendRun, null, null);
    else { chartElements().forEach(hideChartTip); hideReadout(); }
    return;
  }
  showRun(hit.run, element, hit);
}

function onChartLeave() {
  hoveredChart = null;
  chartElements().forEach(hideChartTip);
  if (pinnedTrendRun) showRun(pinnedTrendRun, null, null);
  else hideReadout();
}

// -- the run behind the point -----------------------------------------------
//
// A point on a chart is a number with no story: which job put it there, on whose
// schedule, and what it freed. That story is exactly a history row, so the trends
// card renders one -- built by the same function the history table uses, so the two
// can never come to disagree. A pin keeps a run there while the pointer goes off to
// compare it against another.

let pinnedTrendRun = null;
let shownTrendRun = null;
//: Full run records already fetched, by id. A charted run has finished, so its
//: record will never change again and one fetch per run is all this ever costs.
const runCache = new Map();
let runFetchTimer = null;

//: What the chart point alone knows, in the shape a history row expects. Every
//: charted run succeeded and finished, and a run that finished started its own
//: duration earlier; only the trigger and the job's detail have to be fetched, and
//: they fill in a moment later rather than holding the row back.
function partialRun(point) {
  const finished = Date.parse(point.finished_at);
  const started = Number.isFinite(finished)
    ? new Date(finished - (point.duration_seconds || 0) * 1000).toISOString()
    : null;
  const metrics = {};
  if (point.repo_size_after !== null && point.repo_size_after !== undefined) {
    metrics.repo_size_after = point.repo_size_after;
  }
  return {
    id: point.id, job: point.job, repository: point.repository, status: 'success',
    dry_run: false, started_at: started, duration_seconds: point.duration_seconds,
    trigger: '…', metrics,
  };
}

function showReadout(runId) {
  const cached = runCache.get(runId);
  const point = cached ? null : trendPoints.find((p) => p.id === runId);
  if (!cached && !point) { hideReadout(); return; }
  shownTrendRun = runId;
  const pinned = pinnedTrendRun === runId;
  const element = $('trend-readout');
  $('readout-what').textContent = pinned ? 'Pinned run' : 'The run under the pointer';
  $('unpin').hidden = !pinned;
  element.classList.toggle('pinned', pinned);
  $('readout-row').innerHTML = `<tr>${historyCells(cached || partialRun(point))}</tr>`;
  element.hidden = false;
  paintRelativeTimes();
  if (!cached) queueRunFetch(runId);
}

function hideReadout() {
  shownTrendRun = null;
  $('trend-readout').hidden = true;
}

function queueRunFetch(runId) {
  clearTimeout(runFetchTimer);
  runFetchTimer = setTimeout(async () => {
    let run;
    try { run = await request(`runs/${runId}`); } catch (error) { return; }
    runCache.set(runId, run);
    // The pointer may have moved on while this was in flight; the run it moved to
    // is the one that should be painted.
    if (shownTrendRun === runId) showReadout(runId);
  }, 120);
}

// The ring that stays on a pinned run while the pointer reads something else. Also
// what clears them, since an unpinned run pins nothing anywhere.
function markPinned() {
  for (const element of chartElements()) {
    const model = chartModels[Number(element.dataset.chart)];
    const ring = element.querySelector('.pinned');
    if (!ring) continue;
    const hit = pinnedTrendRun && model && model.hits.find((h) => h.run === pinnedTrendRun);
    if (!hit) { ring.setAttribute('opacity', '0'); continue; }
    ring.setAttribute('cx', hit.x.toFixed(1));
    ring.setAttribute('cy', hit.y.toFixed(1));
    ring.setAttribute('stroke', hit.color);
    ring.setAttribute('opacity', '1');
  }
}

function pinTrendRun(runId) {
  pinnedTrendRun = runId;
  markPinned();
  showRun(runId, null, null);
}

function unpinTrendRun() {
  pinnedTrendRun = null;
  markPinned();
  chartElements().forEach(hideChartTip);
  hideReadout();
}

//: renderTrends rebuilds every chart from scratch whenever the history moves, which
//: on a page that polls is every few seconds. The pin has to be put back afterwards
//: or it would quietly disappear -- and dropped for good once its run has aged out
//: of the charted window.
function paintPinnedRun() {
  if (!pinnedTrendRun) return;
  if (!trendPoints.some((p) => p.id === pinnedTrendRun)) { unpinTrendRun(); return; }
  markPinned();
  showRun(pinnedTrendRun, null, null);
}

//: Which charts are drawn on a log axis, one flag each. Remembered across reloads:
//: someone who reads the duration chart in log scale reads it that way every time.
const SCALE_KEY = 'restic-pruner.log-scale';
const logScale = readLogScale();

function readLogScale() {
  try {
    return JSON.parse(localStorage.getItem(SCALE_KEY)) || {};
  } catch (error) {
    // Storage can be denied outright inside an iframe. The toggles still work,
    // they just start linear again next time.
    return {};
  }
}

function writeLogScale() {
  try { localStorage.setItem(SCALE_KEY, JSON.stringify(logScale)); } catch (error) {}
}

//: Whether the three trends are laid over one another. Remembered for the same
//: reason the log flags are: it is a way of reading the card, not a passing look.
const VIEW_KEY = 'restic-pruner.overlay';
let overlaid = readOverlay();

function readOverlay() {
  try { return localStorage.getItem(VIEW_KEY) === '1'; } catch (error) { return false; }
}

function writeOverlay() {
  try { localStorage.setItem(VIEW_KEY, overlaid ? '1' : '0'); } catch (error) {}
}

//: The last points fetched, so flipping a scale repaints without a round trip.
let trendPoints = [];

async function refreshTrends() {
  let data;
  try { data = await request('trends'); } catch (error) { return; }
  trendPoints = data.points;
  renderTrends();
}

function renderTrends() {
  const el = $('charts');
  hideAllChartTips();
  chartModels.length = 0;
  $('view-overlay').setAttribute('aria-pressed', String(overlaid));
  if (trendPoints.length < 2) {
    el.innerHTML = '<p class="muted">Not enough finished runs yet.</p>';
    hideReadout();
    return;
  }
  if (overlaid) {
    el.innerHTML = overlayView(trendPoints);
  } else {
    const repoColor = repositoryColors(trendPoints);
    const jobColor = (job) => cssVar('--job-' + job);
    el.innerHTML =
      chart('size', 'Repository size', seriesBy(trendPoints, 'repository', 'repo_size_after', repoColor), BYTES_AXIS) +
      chart('unused', 'Unused space', seriesBy(trendPoints, 'repository', 'unused_bytes', repoColor), BYTES_AXIS) +
      chart('duration', 'Run duration', seriesBy(trendPoints, 'job', 'duration_seconds', jobColor), TIME_AXIS);
  }
  paintPinnedRun();
}

// What each sortable column sorts on. A run with nothing to compare -- an
// unfinished one has no duration, a check never reports a size -- has no place in
// the order and goes to the bottom whichever way the arrow points.
const SORT_KEYS = {
  started: (run) => Date.parse(run.started_at),
  duration: (run) => run.duration_seconds,
  size: (run) => run.metrics.repo_size_after,
};

function sortedHistory() {
  const key = SORT_KEYS[historySort.column];
  if (!key) return historyRuns;
  const direction = historySort.ascending ? 1 : -1;
  return [...historyRuns].sort((a, b) => {
    const left = key(a), right = key(b);
    const missingLeft = left === null || left === undefined || Number.isNaN(left);
    const missingRight = right === null || right === undefined || Number.isNaN(right);
    if (missingLeft || missingRight) return missingLeft - missingRight;
    return (left - right) * direction;
  });
}

function paintSortHeaders() {
  document.querySelectorAll('th[data-sort]').forEach((th) => {
    const active = th.dataset.sort === historySort.column;
    const arrow = th.querySelector('.arrow');
    if (active) {
      th.setAttribute('aria-sort', historySort.ascending ? 'ascending' : 'descending');
      arrow.textContent = historySort.ascending ? '▲' : '▼';
    } else {
      th.removeAttribute('aria-sort');
      arrow.textContent = '↕';
    }
  });
}

async function refreshHistory() {
  const filter = historyJob;
  let data;
  try {
    data = await request(filter ? `runs?limit=25&job=${filter}` : 'runs?limit=25');
  } catch (error) { return; }
  // The dropdown may have moved on while this was in flight; its own fetch is the
  // one that should paint.
  if (historyJob !== filter) return;
  // The filter is part of the signature: the same runs under a different filter
  // are a different table.
  const signature = JSON.stringify([filter, data.runs]);
  if (signature === historySignature) return;
  const filterChanged = historyFilterShown !== null && historyFilterShown !== filter;
  historySignature = signature;
  historyFilterShown = filter;
  historyRuns = data.runs;
  renderHistory();
  // Only when the history itself moved, and not merely because the dropdown did:
  // the charts are unfiltered, the poll loop runs every few seconds, and the whole
  // series is far too much to re-pull that often.
  if (!filterChanged) await refreshTrends();
}

//: The "Detail" column in words, without markup, so the copied table reads the
//: same as the painted one.
function historyDetail(run) {
  if (run.error) return run.error.split('\n')[0].slice(0, 80);
  if ((run.job === 'prune' || run.job === 'repack') && run.metrics.bytes_reclaimed !== undefined) {
    const removed = run.metrics.snapshots_removed !== undefined
      ? `${run.metrics.snapshots_removed} removed · ` : '';
    return `${removed}${bytes(run.metrics.bytes_reclaimed)} freed`;
  }
  if (run.job === 'check' && run.metrics.read_data_subset) {
    const count = run.metrics.snapshot_count !== undefined
      ? ` · ${run.metrics.snapshot_count} snapshots` : '';
    return `${readScope(run.metrics.read_data_subset)}${count}`;
  }
  return '';
}

//: The eight cells of a history row. The trends card renders one of these too, for
//: the run being read off the charts, so they are built in one place and cannot come
//: to say different things about the same run.
function historyCells(run) {
  const text = historyDetail(run);
  const detail = run.error ? `<span class="muted">${escapeHtml(text)}</span>` : escapeHtml(text);
  return `<td>${jobTag(run.job)}${run.dry_run ? ' <span class="muted">(dry)</span>' : ''}</td>
      <td>${escapeHtml(run.repository)}</td>
      <td>${pill(run.status)}</td>
      <td>${when(run.started_at)}</td>
      <td>${duration(run.duration_seconds)}</td>
      <td>${run.metrics.repo_size_after === undefined ? '–' : bytes(run.metrics.repo_size_after)}</td>
      <td class="muted">${escapeHtml(run.trigger)}</td>
      <td>${detail}</td>`;
}

//: The ISO week a run started in, as a comparable key. Weeks begin on Monday, so
//: a Sunday cluster falls wholly inside one of them, and the year comes from the
//: week's Thursday, which is what makes the turn of the year unambiguous.
function isoWeekKey(iso) {
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return '';
  const thursday = new Date(date);
  thursday.setHours(0, 0, 0, 0);
  thursday.setDate(thursday.getDate() - ((date.getDay() + 6) % 7) + 3);
  const firstThursday = new Date(thursday.getFullYear(), 0, 4);
  firstThursday.setDate(firstThursday.getDate() - ((firstThursday.getDay() + 6) % 7) + 3);
  const week = 1 + Math.round((thursday - firstThursday) / (7 * 86400000));
  return `${thursday.getFullYear()}-W${week}`;
}

function renderHistory() {
  paintSortHeaders();
  const body = $('history');
  if (!historyRuns.length) {
    const nothing = historyJob ? `No ${historyJob} runs yet.` : 'No runs yet.';
    body.innerHTML = `<tr><td colspan="8" class="muted">${nothing}</td></tr>`;
    return;
  }
  // Banding only means anything while the rows are in time order. Under the
  // duration and size sorts the weeks interleave, and the stripes would say
  // nothing about the runs they were striping.
  const banded = historySort.column === null || historySort.column === 'started';
  let previousWeek = null;
  let band = false;
  body.innerHTML = sortedHistory().map((run) => {
    const week = isoWeekKey(run.started_at);
    if (previousWeek !== null && week !== previousWeek) band = !band;
    previousWeek = week;
    return `<tr${banded && band ? ' class="week-band"' : ''} data-run-id="${run.id}">`
      + historyCells(run) + '</tr>';
  }).join('');
  paintRelativeTimes();
}

document.addEventListener('click', async (event) => {
  // First, so that a copy button sitting inside the history card cannot also pin
  // that card's log on its way past the row handler below.
  const copyButton = event.target.closest('[data-copy]');
  if (copyButton) {
    let text = null;
    try {
      const build = COPY_SOURCES[copyButton.dataset.copy];
      text = build ? build(copyButton) : null;
    } catch (error) {
      text = null;
    }
    if (!text) { toast('Nothing to copy yet', true); return; }
    try {
      await copyText(text);
    } catch (error) {
      toast(error.message, true);
      return;
    }
    // Say so on the button itself: the toast is at the far end of the page from
    // whichever corner was clicked.
    const label = copyButton.textContent;
    copyButton.classList.add('done');
    copyButton.textContent = '✓';
    clearTimeout(copyButton._timer);
    copyButton._timer = setTimeout(() => {
      copyButton.classList.remove('done');
      copyButton.textContent = label;
    }, 1400);
    toast(`Copied ${text.split('\n').length} lines of Markdown`);
    return;
  }

  const runButton = event.target.closest('[data-run]');
  if (runButton) {
    const job = runButton.dataset.run;
    const dry = runButton.dataset.dry === '1';
    const repository = runButton.dataset.repository || null;
    runButton.disabled = true;
    try {
      await request(`jobs/${job}/run`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dry_run: dry, repository }),
      });
      toast(`${job}${dry ? ' (dry run)' : ''} started${repository ? ' on ' + repository : ''}`);
      pinnedRunId = null;
      setTimeout(refreshStatus, 400);
    } catch (error) {
      toast(error.message, true);
      runButton.disabled = false;
    }
    return;
  }

  const unlockButton = event.target.closest('[data-unlock]');
  if (unlockButton) {
    const repository = unlockButton.dataset.unlock;
    if (!confirm(`Remove stale restic locks on "${repository}"?\n\nOnly do this when you are sure no other restic process is running against it.`)) return;
    try {
      await request('unlock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ repository, remove_all: false }),
      });
      toast('Stale locks removed');
    } catch (error) {
      toast(error.message, true);
    }
    return;
  }

  const row = event.target.closest('tr[data-run-id]');
  if (row) {
    const runId = row.dataset.runId;
    pinnedRunId = runId;
    // The same run, marked on the charts and spelled out under them -- when it is
    // one of the runs the charts drew. A failed or unfinished run is on no line.
    if (trendPoints.some((point) => point.id === runId)) pinTrendRun(runId);
    $('log-title').textContent = 'Log – ' + runId.slice(0, 8);
    try {
      $('log').textContent = await request(`runs/${runId}/log`);
      $('log').scrollTop = 0;
    } catch (error) {
      // Logs rotate out well before run records do, so an old run in the table
      // legitimately has no log left.
      $('log').textContent =
        'The full log for this run is no longer kept. Its summary is in the history row.';
    }
  }
});

// Delegated, because refreshTrends rebuilds the charts whenever the history moves
// and per-chart listeners would not survive it.
$('charts').addEventListener('click', (event) => {
  const button = event.target.closest('button.scale');
  if (button) {
    const key = button.dataset.scale;
    logScale[key] = !logScale[key];
    writeLogScale();
    renderTrends();
    return;
  }
  // A click on the drawing pins whatever the pointer was already reading, so the
  // row below stays put while the eye goes back to the lines. Clicking it again
  // lets go.
  const element = event.target.closest('.chart[data-chart]');
  if (!element) return;
  const hit = nearestHit(element, event);
  if (!hit) return;
  if (pinnedTrendRun === hit.run) unpinTrendRun();
  else pinTrendRun(hit.run);
});
$('charts').addEventListener('pointermove', onChartHover);
$('charts').addEventListener('pointerleave', onChartLeave);
$('charts').addEventListener('pointercancel', onChartLeave);

$('view-overlay').addEventListener('click', () => {
  overlaid = !overlaid;
  writeOverlay();
  renderTrends();
});

$('unpin').addEventListener('click', unpinTrendRun);
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && pinnedTrendRun) unpinTrendRun();
});

$('history-job').addEventListener('change', (event) => {
  historyJob = event.target.value;
  refreshHistory();
});

// Three states, in Wikipedia's order: the served order, then ascending, then
// descending, then back. One column sorts at a time.
document.querySelectorAll('th[data-sort] button.sort').forEach((button) => {
  button.addEventListener('click', () => {
    const column = button.parentElement.dataset.sort;
    if (historySort.column !== column) historySort = { column, ascending: true };
    else if (historySort.ascending) historySort = { column, ascending: false };
    else historySort = { column: null, ascending: false };
    renderHistory();
  });
});

refreshStatus();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
